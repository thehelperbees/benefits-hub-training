<!doctype html>
<html lang="en">
<head>
<script src="../../gate.js" data-home="../index.html"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetna Benefits Hub — Managing Common Exceptions and Escalations | The Helper Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#003322; --green-soft:#0B4A36;
    --cream:#FCF7EE; --cream-dim:#F5EEE0;
    --yellow:#FFD646; --lime:#E6EC82; --teal:#82D2CA;
    --peach:#FDA761; --pink:#FEB3D3; --rasp:#CC4983;
    --sand:#E3D7BB; --ink:#0F2E23;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow-x:hidden;background:var(--green);font-family:'Manrope',system-ui,-apple-system,Arial,sans-serif;color:var(--ink);}
  #app{max-width:1080px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:22px 22px 26px;width:100%;box-sizing:border-box;}

  /* ---------- top chrome ---------- */
  .top{display:flex;align-items:center;gap:16px;padding:2px 4px 14px;flex:none;}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .brand svg{width:20px;height:20px;flex:none;}
  .brand span{color:var(--cream);font-weight:800;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;}
  .track{flex:1;display:flex;align-items:center;gap:10px;}
  .prog{flex:1;height:6px;background:rgba(252,247,238,.16);border-radius:6px;overflow:hidden;}
  .prog>i{display:block;height:100%;width:0;background:var(--yellow);border-radius:6px;transition:width .35s ease;}
  .stepnum{font-size:12px;font-weight:700;color:var(--cream);opacity:.55;white-space:nowrap;letter-spacing:.2px;}
  .home-link{display:inline-flex;align-items:center;gap:6px;color:var(--cream);opacity:.72;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px;flex:none;transition:opacity .15s ease,background .15s ease;}
  .home-link:hover{opacity:1;background:rgba(252,247,238,.08);}
  .home-link svg{width:13px;height:13px;flex:none;}

  /* ---------- stage ---------- */
  .stage{flex:1;min-height:0;background:var(--cream);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);}
  .ix{position:absolute;inset:0;overflow-y:auto;padding:38px 64px;box-sizing:border-box;}
  .center{display:flex;flex-direction:column;}
  .ix.center>*:first-child{margin-top:auto;}
  .ix.center>*:last-child{margin-bottom:auto;}
  .wrap{max-width:620px;width:100%;}
  .wrap.wide{max-width:760px;width:100%;}
  .browser{width:100%;}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--rasp);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12.5px;margin-bottom:16px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--rasp);}
  h1.hl{font-size:38px;font-weight:800;line-height:1.12;letter-spacing:-.5px;margin:0 0 14px;color:var(--green);}
  .sub{font-size:17.5px;line-height:1.55;color:#3C5A4D;margin:0 0 6px;max-width:52ch;}
  .kicker{font-size:15px;font-weight:700;color:var(--green);margin:0 0 4px;}

  /* ---------- cover ---------- */
  .cover-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--cream);border-radius:999px;padding:8px 16px 8px 10px;font-size:13px;font-weight:800;letter-spacing:.3px;margin-bottom:26px;}
  .cover-badge svg{width:16px;height:16px;}
  .cover-meta{display:flex;gap:22px;margin-top:28px;}
  .cover-meta div{display:flex;flex-direction:column;gap:2px;}
  .cover-meta b{font-size:13px;color:var(--green);font-weight:800;}
  .cover-meta span{font-size:12.5px;color:#5c7568;}

  /* ---------- browser mock ---------- */
  .browser{border:1.5px solid var(--sand);border-radius:14px;overflow:visible;background:#fff;box-shadow:0 10px 26px -14px rgba(0,50,34,.25);max-width:520px;width:100%;}
  .browser.compact{max-width:520px;}
  .browser.wide{max-width:760px;}
  .field-label{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--rasp);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px;}
  .field-label svg{width:13px;height:13px;flex:none;}
  .browser .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cream-dim);border-bottom:1px solid var(--sand);border-radius:12.5px 12.5px 0 0;}
  .browser .dots{display:flex;gap:5px;flex:none;}
  .browser .dots i{width:8px;height:8px;border-radius:50%;background:#D8CDB0;display:block;}
  .browser .url{flex:1;min-width:0;background:#fff;border:1px solid var(--sand);border-radius:8px;padding:6px 12px;font-size:12.5px;color:#5c7568;font-weight:700;display:flex;align-items:center;gap:7px;overflow:hidden;}
  .browser .url span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .browser .url svg{width:11px;height:11px;flex:none;opacity:.6;}
  .browser .body{background:var(--cream-dim);position:relative;}
  .browser .body img{display:block;width:100%;height:auto;border-radius:0 0 12.5px 12.5px;}
  .hotspot-btn{position:absolute;border:2.5px solid var(--rasp);border-radius:9px;background:rgba(204,73,131,.07);cursor:pointer;padding:0;animation:hotpulse 1.8s ease-in-out infinite;}
  .hotspot-btn:hover{background:rgba(204,73,131,.14);}
  @keyframes hotpulse{
    0%,100%{box-shadow:0 0 0 5px rgba(204,73,131,.16);}
    50%{box-shadow:0 0 0 10px rgba(204,73,131,.05);}
  }
  .hotspot-tag{position:absolute;background:var(--rasp);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.2px;border-radius:7px;padding:5px 10px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);}
  .hotspot-tag.clickable{cursor:pointer;pointer-events:auto;}
  .shot-img{transition:opacity .18s ease;}

  .emailcard{border:1.5px solid var(--sand);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 10px 26px -14px rgba(0,50,34,.25);max-width:520px;width:100%;}
  .emailcard .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--cream-dim);border-bottom:1px solid var(--sand);font-size:11.5px;font-weight:800;color:#5c7568;letter-spacing:.3px;text-transform:uppercase;}
  .emailcard img{display:block;width:100%;height:auto;}

  /* ---------- recreated email compose mock (Step 9 — no real screenshot yet) ---------- */
  .emailcompose{padding:0 0 4px;}
  .ec-field{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--sand);font-size:13px;}
  .ec-field span.lbl{flex:none;width:56px;color:#8a8a8a;font-weight:700;font-size:12px;}
  .ec-field span.val{color:#1a1a1a;font-weight:600;}
  .ec-field span.placeholder{color:var(--rasp);font-style:italic;font-weight:700;}
  .ec-body{padding:16px;font-size:13.5px;line-height:1.6;color:#333;min-height:120px;}
  .ec-body p{margin:0 0 12px;}
  .ec-body .ec-ph{color:var(--rasp);font-style:italic;font-weight:700;}
  .ec-sig{margin-top:4px;padding-top:10px;border-top:1px solid var(--sand);}
  .ec-sig p{margin:0 0 2px;font-size:12.5px;color:#555;}
  .ec-sendrow{display:flex;justify-content:flex-end;padding:12px 16px;}
  .ec-sendbtn{background:#1D5FBF;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-family:inherit;font-weight:800;font-size:13px;}

  /* ---------- concept card grid (Step 1) ---------- */
  .example-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:620px;}
  .example-card{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:16px 18px;box-shadow:0 6px 16px -10px rgba(0,50,34,.2);}
  .example-card .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--cream-dim);display:flex;align-items:center;justify-content:center;color:var(--rasp);}
  .example-card .ic svg{width:18px;height:18px;}
  .example-card b{display:block;font-size:14.5px;color:var(--green);}
  @media(max-width:640px){ .example-grid{grid-template-columns:1fr;} }

  /* ---------- troubleshoot-before-you-escalate category cards (click to expand) ---------- */
  .ts-stack{display:flex;flex-direction:column;gap:14px;width:100%;max-width:660px;}
  .ts-card{background:#fff;border:1.5px solid var(--sand);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px -10px rgba(0,50,34,.2);}
  .ts-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:transparent;border:none;padding:17px 22px;font-family:inherit;text-align:left;cursor:pointer;}
  .ts-card-head:hover{background:var(--cream-dim);}
  .ts-card-title{font-size:14.5px;color:var(--rasp);font-weight:800;letter-spacing:.2px;}
  .ts-chev{width:16px;height:16px;flex:none;color:var(--rasp);transition:transform .2s ease;}
  .ts-card.expanded .ts-chev{transform:rotate(180deg);}
  .ts-card-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .ts-card.expanded .ts-card-body{max-height:600px;}
  .ts-card-body ul{margin:0;padding:0 22px 18px 41px;}
  .ts-card-body li{font-size:13.5px;color:#3C5A4D;line-height:1.55;margin-bottom:7px;}
  .ts-card-body li:last-child{margin-bottom:0;}


  .reslink{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:13px 18px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;text-decoration:none;font-size:14px;font-weight:700;color:var(--green);transition:.15s;box-shadow:0 6px 16px -10px rgba(0,50,34,.2);}
  .reslink:hover{border-color:var(--teal);}
  .reslink .reslink-ic{flex:none;width:18px;height:18px;color:var(--rasp);}
  .reslink .reslink-arrow{margin-left:auto;width:14px;height:14px;flex:none;color:var(--rasp);}

  .capnote{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#5c7568;font-weight:700;}
  .capnote svg{width:14px;height:14px;flex:none;color:var(--rasp);}

  /* ---------- interactive form fill (real fillable recreation) ---------- */
  .rf-body{padding:20px 22px 22px;}
  .rf-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .rf-progress-track{flex:1;height:7px;background:#fff;border:1px solid var(--sand);border-radius:6px;overflow:hidden;display:block;}
  .rf-progress-track>i{display:block;height:100%;width:0;background:var(--rasp);border-radius:6px;transition:width .2s ease;}
  .rf-progress-text{font-size:12.5px;font-weight:800;color:var(--green);white-space:nowrap;}
  .rf-field{margin-bottom:20px;}
  .rf-label{font-weight:800;font-size:14px;color:#1f2d27;margin-bottom:3px;}
  .rf-label .req{color:var(--rasp);margin-left:2px;}
  .rf-label .opttag{font-weight:600;color:#8a8a8a;font-size:12px;text-transform:none;letter-spacing:0;margin-left:6px;}
  .rf-input,.rf-select,.rf-textarea{width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;color:#1a1a1a;background:#fff;margin-top:6px;}
  .rf-input:focus,.rf-select:focus,.rf-textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .rf-textarea{min-height:84px;resize:vertical;}
  .rf-filedrop{margin-top:6px;border:1.5px dashed var(--sand);border-radius:9px;padding:16px;text-align:center;font-size:13px;color:#8a8a8a;background:#fff;}
  .rf-hint{display:flex;align-items:flex-start;gap:7px;margin-top:8px;font-size:12.5px;color:var(--rasp);font-weight:700;line-height:1.4;}
  .rf-hint svg{flex:none;width:14px;height:14px;margin-top:1px;}
  .rf-routing{margin:8px 0 0 21px;padding:0;list-style:none;}
  .rf-routing li{margin-bottom:8px;}
  .rf-routing li:last-child{margin-bottom:0;}
  .rf-routing .rr-topic{font-size:12px;color:#5c7568;font-weight:700;line-height:1.4;}
  .rf-routing .rr-dest{font-size:12px;color:var(--green);font-weight:800;line-height:1.4;margin-top:1px;}
  .rf-submitbtn{background:var(--green);color:#fff;border:none;border-radius:11px;padding:13px 24px;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:6px;}
  .rf-submitbtn:disabled{opacity:.35;cursor:default;}
  .rf-confirm{display:flex;align-items:flex-start;gap:10px;background:#EAF6E9;border:1.5px solid #8FCB86;border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14px;color:#256b1c;line-height:1.5;}
  .rf-confirm svg{flex:none;width:18px;height:18px;margin-top:1px;}
  .rf-confirm b{display:block;margin-bottom:2px;}

  /* ---------- compact confirmation view (replaces form after submit) ---------- */
  .rf-donebadge{width:56px;height:56px;border-radius:50%;background:#EAF6E9;border:2px solid #8FCB86;color:#256b1c;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .rf-donebadge svg{width:28px;height:28px;}

  /* ---------- knowledge check ---------- */
  .scenario-card{background:var(--green);color:var(--cream);border-radius:14px;padding:20px 22px;margin-bottom:22px;}
  .scenario-card .lbl{font-size:11px;font-weight:800;color:var(--yellow);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;}
  .scenario-card p{margin:0;font-size:16px;line-height:1.5;}
  .q{font-size:17px;font-weight:800;margin-bottom:16px;color:var(--green);}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:13px 16px;margin:9px 0;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;font-weight:600;transition:.15s;}
  .opt .ltr{flex:none;width:22px;height:22px;border-radius:50%;background:var(--cream-dim);color:var(--green);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .opt:hover:not(:disabled){border-color:var(--teal);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:#EAF6E9;border-color:#8FCB86;}
  .opt.correct .ltr{background:#8FCB86;color:#fff;}
  .opt.wrong{opacity:.4;}
  .answer{background:var(--cream-dim);border:1.5px solid var(--sand);border-radius:12px;padding:16px 18px;font-size:14.5px;margin-top:14px;line-height:1.55;color:#3C5A4D;}
  .answer b{color:var(--rasp);}

  /* ---------- bottom nav ---------- */
  .bot{display:flex;align-items:center;gap:12px;padding:14px 4px 2px;flex:none;}
  button.nav{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;letter-spacing:.2px;}
  .back{background:transparent;color:var(--cream);border:1.5px solid rgba(252,247,238,.3);}
  .back[disabled]{opacity:.25;cursor:default;}
  .next{background:var(--yellow);color:var(--green);margin-left:auto;}
  .next[disabled]{opacity:.35;cursor:default;}
  .cta-btn{display:inline-flex;align-items:center;gap:9px;background:var(--yellow);color:var(--green);font-weight:800;font-size:15px;text-decoration:none;border-radius:12px;padding:14px 22px;margin-top:22px;letter-spacing:.2px;}
  .cta-btn svg{width:16px;height:16px;flex:none;}
  .cta-btn:hover{filter:brightness(0.96);}
  .cta-note{font-size:12px;color:#8a7a55;font-weight:700;margin-top:10px;font-style:italic;}

  /* ---------- try-it-yourself confirmation ---------- */
  .confirm-prompt{font-size:17px;font-weight:700;color:var(--green);margin:26px 0 14px;}
  .confirm-row{display:flex;gap:12px;flex-wrap:wrap;}
  .confirm-btn{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:13px 20px;font-family:inherit;font-weight:800;font-size:14.5px;color:var(--ink);cursor:pointer;transition:.15s;}
  .confirm-btn:hover:not(:disabled){border-color:var(--teal);}
  .confirm-btn:disabled{cursor:default;opacity:.45;}
  .confirm-btn svg{width:16px;height:16px;flex:none;}
  .confirm-btn.picked-yes{border-color:#8FCB86;background:#EAF6E9;color:#256b1c;opacity:1;}
  .confirm-btn.picked-no{border-color:#F0B6A4;background:#FDEDEA;color:#9c3a1f;opacity:1;}
  .confirm-reveal{border-radius:14px;padding:18px 20px;margin-top:16px;font-size:15px;line-height:1.55;}
  .confirm-reveal.good{background:#EAF6E9;color:#256b1c;border:1.5px solid #8FCB86;}
  .confirm-reveal.warn{background:#FDEDEA;color:#9c3a1f;border:1.5px solid #F0B6A4;}
  .confirm-reveal b{display:block;margin-bottom:4px;}

  /* ---------- start overlay ---------- */
  #startOverlay{position:fixed;inset:0;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;text-align:center;padding:24px;}
  #startOverlay svg{width:40px;height:40px;}
  .so-brand{color:var(--cream);font-weight:800;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;}
  #startOverlay h1{color:var(--cream);font-size:32px;font-weight:800;margin:2px 0 0;letter-spacing:-.5px;}
  #startOverlay p{color:#B9CFC3;font-size:15.5px;margin:0 0 10px;max-width:40ch;}
  #startBtn{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--green);font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:16px 28px;cursor:pointer;letter-spacing:.2px;}
  #startBtn svg{width:18px;height:18px;}
  #startBtn:hover{filter:brightness(0.97);}
  #startOverlay.hide{display:none;}
  .audiobtn{background:transparent;border:1.5px solid rgba(252,247,238,.3);color:var(--cream);border-radius:12px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;min-width:168px;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .audiobtn svg{width:14px;height:14px;flex:none;}
  .audiobtn[hidden]{display:none;}

  @media(max-width:640px){
    .ix{padding:32px 22px;} h1.hl{font-size:27px;} .dm-grid{grid-template-columns:1fr;}
    .cover-meta{flex-direction:column;gap:10px;}
    .browser .body{padding:18px 16px;}
    .hotspot-tag{font-size:10px;padding:3px 7px;border-radius:5px;}
    #app{padding:16px 14px 20px;}
  }
</style>
</head>
<body>
<div id="startOverlay">
  <svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FFD646" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#FFD646"/></svg>
  <div class="so-brand">The Helper Bees</div>
  <h1>Benefits Hub: Managing Common Exceptions and Escalations</h1>
  <p>A short, narrated walkthrough — click below to begin with sound.</p>
  <button id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start module</button>
</div>
<div id="app">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FFD646" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="#FFD646"/></svg>
      <span>The Helper Bees</span>
    </div>
    <div class="track">
      <span class="prog"><i id="bar"></i></span>
      <span class="stepnum" id="stepnum"></span>
    </div>
    <a class="home-link" href="../Begin-Training.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>Training Home</a>
  </div>

  <div class="stage" id="stage"></div>

  <div class="bot">
    <button class="nav back" id="back">Back</button>
    <button class="audiobtn" id="audioToggle" hidden></button>
    <button class="nav next" id="next">Next</button>
  </div>
  <audio id="au"></audio>
</div>

<script>
/* ================= CONTENT ================= */
var ICON_VISIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

function assembleScreens(){
  var arr = [COVER_STEP, TROUBLESHOOT_STEP, RECOGNIZE_STEP, BRANCH_STEP, SUPPORT_FORM_STEP, EMAILCOORD_STEP, TIP_STEP, TRYIT_STEP, OUTRO_STEP];

/* ================= ENGINE ================= */
var i=0, answered={};
var stage=document.getElementById('stage'), bar=document.getElementById('bar'),
    back=document.getElementById('back'), next=document.getElementById('next'),
    stepnum=document.getElementById('stepnum'), au=document.getElementById('au'),
    audioToggle=document.getElementById('audioToggle');
var AUDIO_DIR='assets/audio/';

function play(src){
  if(!src){ audioToggle.hidden=true; return; }
  au.src=AUDIO_DIR+src; audioToggle.hidden=false;
  au.play().catch(function(){ updateAudioBtn(); });
  updateAudioBtn();
}
function stopAu(){ try{au.pause();}catch(e){} au.removeAttribute('src'); audioToggle.hidden=true; }

var ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

function updateAudioBtn(){
  audioToggle.innerHTML = au.paused
    ? ICON_PLAY+'<span>Play narration</span>'
    : ICON_PAUSE+'<span>Pause narration</span>';
}
au.addEventListener('play', updateAudioBtn);
au.addEventListener('pause', updateAudioBtn);
au.addEventListener('ended', updateAudioBtn);

audioToggle.onclick=function(){
  if(au.paused){
    if(au.ended){ au.currentTime=0; }
    au.play().catch(function(){});
  } else {
    au.pause();
  }
};

function el(tag,cls){var e=document.createElement(tag); if(cls)e.className=cls; return e;}

function urlBar(url){
  return '<div class="bar"><div class="dots"><i></i><i></i><i></i></div>'+
    '<div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>'+url+'</span></div></div>';
}

function visual(s, opts){
  opts = opts || {};
  if(s.visual==='shot'){
    var b=el('div','browser'+(s.compact?' compact':'')+(s.wide?' wide':''));
    var capPx = s.wide ? 760 : 520;
    if(s.vhCap && s.imgAspect){ b.style.maxWidth = 'min('+capPx+'px, calc(' + s.vhCap + 'vh / ' + s.imgAspect + '))'; }
    var showAlt = opts.showAlt;
    var imgSrc = (showAlt && s.img2) ? s.img2 : s.img;
    b.innerHTML = urlBar(s.url) + '<div class="body"><img src="'+imgSrc+'" alt="" class="shot-img"></div>';
    if(s.hotspot && !showAlt){
      var h=s.hotspot;
      var body=b.querySelector('.body');
      var hbtn=el('button','hotspot-btn');
      hbtn.type='button';
      hbtn.setAttribute('aria-label', h.tag);
      hbtn.style.left=h.left+'%'; hbtn.style.top=h.top+'%'; hbtn.style.width=h.width+'%'; hbtn.style.height=h.height+'%';
      body.appendChild(hbtn);
      var tag=el('div','hotspot-tag'+(opts.onClick?' clickable':''));
      tag.textContent=h.tag;
      tag.style.left=h.tagLeft+'%'; tag.style.top=h.tagTop+'%';
      body.appendChild(tag);
      if(opts.onClick){ hbtn.onclick=opts.onClick; tag.onclick=opts.onClick; }
    }
    return b;
  }
  if(s.visual==='email'){
    var b2=el('div','emailcard');
    if(s.vhCap && s.imgAspect){ b2.style.maxWidth = 'min(520px, calc(' + s.vhCap + 'vh / ' + s.imgAspect + '))'; }
    b2.innerHTML = '<div class="bar">Your inbox</div><img src="'+s.img+'" alt="">';
    return b2;
  }
  if(s.visual==='emailmock'){
    var b3=el('div','emailcard');
    b3.style.maxWidth='560px';
    b3.innerHTML =
      '<div class="bar">New message</div>'+
      '<div class="emailcompose">'+
        '<div class="ec-field"><span class="lbl">To</span><span class="val placeholder">'+s.emailTo+'</span></div>'+
        '<div class="ec-field"><span class="lbl">Subject</span><span class="val">'+s.emailSubject+'</span></div>'+
        '<div class="ec-body">'+s.emailBody.replace(/\[([^\]]+)\]/g, '<span class="ec-ph">[$1]</span>')+'</div>'+
        '<div class="ec-sendrow"><button class="ec-sendbtn" type="button" disabled>Send</button></div>'+
      '</div>';
    return b3;
  }
  if(s.visual==='examplegrid'){
    var b4=el('div','example-grid');
    b4.innerHTML = EXCEPTION_EXAMPLES.map(function(ex){
      return '<div class="example-card"><div class="ic">'+ex.icon+'</div><b>'+ex.label+'</b></div>';
    }).join('');
    return b4;
  }
  if(s.visual==='troubleshoot'){
    var b5=el('div','ts-stack');
    b5.innerHTML = TROUBLESHOOT_CATEGORIES.map(function(cat,idx){
      return '<div class="ts-card" data-idx="'+idx+'">'+
        '<button type="button" class="ts-card-head">'+
          '<span class="ts-card-title">'+cat.title+'</span>'+
          '<svg class="ts-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
        '</button>'+
        '<div class="ts-card-body"><ul>'+
          cat.items.map(function(item){ return '<li>'+item+'</li>'; }).join('')+
        '</ul></div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(b5.querySelectorAll('.ts-card'), function(card){
      var head = card.querySelector('.ts-card-head');
      head.onclick = function(){
        var opening = !card.classList.contains('expanded');
        card.classList.toggle('expanded');
        if(opening){
          var idx = parseInt(card.getAttribute('data-idx'),10);
          var cat = TROUBLESHOOT_CATEGORIES[idx];
          if(cat && cat.au) play(cat.au);
          troubleshootOpened[idx] = true;
          var allOpenNow = TROUBLESHOOT_CATEGORIES.every(function(c,ci){ return !!troubleshootOpened[ci]; });
          next.disabled = !allOpenNow;
        }
      };
    });
    return b5;
  }
}

function expandStep(s, vwrap){
  if(answered[i]) return;
  answered[i] = true;
  var img = vwrap.querySelector('.shot-img');
  var hbtn = vwrap.querySelector('.hotspot-btn');
  var tag = vwrap.querySelector('.hotspot-tag');
  if(hbtn) hbtn.remove();
  if(tag) tag.remove();
  if(img){
    img.style.opacity='0';
    setTimeout(function(){
      img.src = s.img2;
      img.style.opacity='1';
    }, 180);
  }
  var cap = vwrap.querySelector('.capnote');
  if(cap) cap.style.display='flex';
  next.disabled=false;
}

function render(){
  var s=SCREENS[i]; stage.innerHTML=''; stopAu();
  bar.style.width = Math.round(i/(SCREENS.length-1)*100)+'%';
  stepnum.textContent = (s.t==='step'||s.t==='formfill') ? ('Step '+s.n+' of '+s.of) : '';
  back.disabled = (i===0);
  next.textContent = (i===SCREENS.length-1) ? 'Finish' : 'Next';
  next.disabled = false;

  if(s.t==='cover'){
    var d=el('div','ix center');
    d.innerHTML =
      '<div class="wrap">'+
      '<div class="cover-badge"><svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FCF7EE" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="#FCF7EE"/></svg>Benefits Hub</div>'+
      '<h1 class="hl">Managing Common Exceptions and Escalations</h1>'+
      '<p class="sub">Not every issue can be resolved inside Benefits Hub. In the next few minutes, you\'ll learn how to recognize when to escalate, submit a support ticket, and loop in your Account Coordinator so it gets picked up quickly.</p>'+
      '<div class="cover-meta"><div><b>~4 minutes</b><span>self-paced</span></div></div>'+
      '</div>';
    stage.appendChild(d);
    play(s.au);
  }

  else if(s.t==='step'){
    var d2=el('div','ix center');
    d2.innerHTML =
      '<div class="wrap wide">'+
      '<div class="eyebrow"><span class="dot"></span>Step '+s.n+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>'+
      '</div>';
    var vwrap=el('div','wrap wide'); vwrap.style.marginTop='14px';

    if(s.hotspot && s.img2){
      var expanded = !!answered[i];
      vwrap.appendChild(visual(s, {
        showAlt: expanded,
        onClick: function(){ expandStep(s, vwrap); }
      }));
      if(s.caption){
        var cap=el('div','capnote'); cap.style.display = expanded ? 'flex' : 'none';
        cap.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>'+s.caption+'</span>';
        vwrap.appendChild(cap);
      }
      next.disabled = !expanded;
    } else {
      vwrap.appendChild(visual(s));
      if(s.caption){
        var cap=el('div','capnote');
        cap.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>'+s.caption+'</span>';
        vwrap.appendChild(cap);
      }
      if(s.visual==='troubleshoot'){
        var allOpen = TROUBLESHOOT_CATEGORIES.every(function(c,ci){ return !!troubleshootOpened[ci]; });
        next.disabled = !allOpen;
      }
    }

    d2.appendChild(vwrap);
    stage.appendChild(d2);
    play(s.au);
  }

  else if(s.t==='formfill'){
    var dF=el('div','ix'+(formSubmitted[s.formKey]?' center':''));
    var wrapF=el('div','wrap wide');

    if(formSubmitted[s.formKey]){
      // ---- compact confirmation view (replaces the form entirely — no scrolling needed) ----
      wrapF.innerHTML =
        '<div class="eyebrow"><span class="dot"></span>Step '+s.n+'</div>'+
        '<div class="rf-donebadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg></div>'+
        '<h1 class="hl">Ticket submitted</h1>'+
        '<p class="sub">Your Member Support Form is in. You\'ll get a ticket number like <b>#12345</b> — you\'ll need that for the next step, emailing your Account Coordinator.</p>';

      dF.appendChild(wrapF);
      stage.appendChild(dF);
      next.disabled = false;
      play(s.auConfirm);
      return;
    }

    // ---- fillable form (pre-submit) ----
    wrapF.innerHTML =
      '<div class="eyebrow"><span class="dot"></span>Step '+s.n+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>';

    var browserF=el('div','browser wide');
    browserF.innerHTML = urlBar(s.url);
    var bodyF=el('div','body rf-body');

    var progWrap=el('div','rf-progress');
    progWrap.innerHTML = '<span class="rf-progress-text" id="rfProgressText"></span><span class="rf-progress-track"><i id="rfProgressBar"></i></span>';
    bodyF.appendChild(progWrap);

    var submitBtn; // referenced by updateProgress, declared before use below

    function fieldComplete(f){ return (formState[f.key]||'').toString().trim().length>0; }

    function updateProgress(){
      // Nothing on this form is required — this bar is informational only and never blocks Submit.
      var trackFields = s.fields.filter(function(f){ return f.type!=='file'; });
      var doneCount = trackFields.filter(fieldComplete).length;
      var pct = trackFields.length ? Math.round(doneCount/trackFields.length*100) : 100;
      var txt = document.getElementById('rfProgressText');
      var barI = document.getElementById('rfProgressBar');
      if(txt) txt.textContent = doneCount+' of '+trackFields.length+' fields filled in';
      if(barI) barI.style.width = pct+'%';
      if(submitBtn) submitBtn.disabled = false;
    }

    s.fields.forEach(function(f){
      var fw=el('div','rf-field');
      var labelHtml = '<div class="rf-label">'+f.label+(f.required?'<span class="req">*</span>':'<span class="opttag">(optional)</span>')+'</div>';
      fw.innerHTML = labelHtml;

      var inputEl;
      if(f.type==='text'){
        inputEl=document.createElement('input');
        inputEl.type='text'; inputEl.className='rf-input';
        inputEl.placeholder=f.placeholder||'';
        inputEl.value=formState[f.key]||'';
        inputEl.addEventListener('input', function(){ formState[f.key]=inputEl.value; updateProgress(); });
        fw.appendChild(inputEl);
      } else if(f.type==='textarea'){
        inputEl=document.createElement('textarea');
        inputEl.className='rf-textarea';
        inputEl.placeholder=f.placeholder||'';
        inputEl.value=formState[f.key]||'';
        inputEl.addEventListener('input', function(){ formState[f.key]=inputEl.value; updateProgress(); });
        fw.appendChild(inputEl);
      } else if(f.type==='select'){
        inputEl=document.createElement('select');
        inputEl.className='rf-select';
        var optDefault=document.createElement('option'); optDefault.value=''; optDefault.textContent='-';
        inputEl.appendChild(optDefault);
        f.options.forEach(function(o){
          var op=document.createElement('option'); op.value=o; op.textContent=o; inputEl.appendChild(op);
        });
        inputEl.value=formState[f.key]||'';
        inputEl.addEventListener('change', function(){ formState[f.key]=inputEl.value; updateProgress(); });
        fw.appendChild(inputEl);
      } else if(f.type==='file'){
        var drop=el('div','rf-filedrop');
        drop.textContent='Choose a file or drag and drop here';
        fw.appendChild(drop);
      }

      if(f.hint){
        var hintEl=el('div','rf-hint');
        var routingHtml = '';
        if(f.hintRouting){
          routingHtml = '<ul class="rf-routing">'+f.hintRouting.map(function(r){
            return '<li><div class="rr-topic">'+r.label+'</div><div class="rr-dest">&rarr; '+r.dest+'</div></li>';
          }).join('')+'</ul>';
        }
        hintEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><span>'+f.hint+'</span>'+routingHtml+'</div>';
        fw.appendChild(hintEl);
      }
      bodyF.appendChild(fw);
    });

    submitBtn=el('button','rf-submitbtn');
    submitBtn.type='button';
    submitBtn.textContent='Submit';
    submitBtn.onclick=function(){
      formSubmitted[s.formKey]=true;
      render();
    };
    bodyF.appendChild(submitBtn);

    browserF.appendChild(bodyF);
    wrapF.appendChild(browserF);
    dF.appendChild(wrapF);
    stage.appendChild(dF);

    updateProgress();
    next.disabled = true;
    play(s.au);
  }

  else if(s.t==='tip'){
    var ix=el('div','ix');
    var wrap=el('div','wrap wide');
    wrap.innerHTML='<div class="eyebrow"><span class="dot"></span>Good to know</div>';
    var sc=el('div','scenario-card');
    sc.innerHTML='<div class="lbl">Heads up</div><p>'+s.scenario+'</p>';
    wrap.appendChild(sc);
    var q=el('div','q'); q.textContent=s.prompt; wrap.appendChild(q);
    var b=el('button','opt reveal-btn');
    b.innerHTML='<span class="ltr">?</span><span>Show me what to do</span>';
    b.onclick=function(){ revealTip(s,wrap,b); };
    wrap.appendChild(b);
    ix.appendChild(wrap);
    stage.appendChild(ix);
    next.disabled = !answered[i];
    if(answered[i]){ b.remove(); showAns(s,wrap); play(s.au); }
    else{ play(s.au); }
  }

  else if(s.t==='tryit'){
    var d3a=el('div','ix center');
    var picked = answered['tryit'];
    var html3a =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>Your turn</div>'+
      '<h1 class="hl">Now try it yourself</h1>'+
      '<p class="sub">Open the support form and walk through it. You don\'t need to submit a real ticket for this practice — just get comfortable with where everything lives.</p>'+
      '<a class="cta-btn" href="'+s.zdUrl+'" target="_blank" rel="noopener">Open the Aetna support form<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>'+
      '<p class="cta-note">This links to Aetna\'s actual support form.</p>'+
      '<div class="confirm-prompt">Were you able to find your way through the form?</div>'+
      '<div class="confirm-row">'+
        '<button type="button" class="confirm-btn'+(picked==='yes'?' picked-yes':'')+'" id="pickYes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>Yes, I found my way through it</button>'+
        '<button type="button" class="confirm-btn'+(picked==='no'?' picked-no':'')+'" id="pickNo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>No, I got stuck</button>'+
      '</div>'+
      (picked==='yes' ? '<div class="confirm-reveal good"><b>Nice work!</b>You\'re ready to open the right ticket the next time an exception comes up, and to loop in your Account Coordinator once you have the ticket number.</div>' : '')+
      (picked==='no' ? '<div class="confirm-reveal warn"><b>No problem — this happens.</b>Revisit the steps above, or reach out to your manager for help. Once you feel good about it, come back and select &ldquo;Yes&rdquo; above to continue.</div>' : '')+
      '</div>';
    d3a.innerHTML = html3a;
    stage.appendChild(d3a);

    var yesBtn=document.getElementById('pickYes'), noBtn=document.getElementById('pickNo');
    if(yesBtn) yesBtn.onclick=function(){ answered['tryit']='yes'; render(); };
    if(noBtn) noBtn.onclick=function(){ answered['tryit']='no'; render(); };

    next.disabled = (picked !== 'yes');
    if(!picked) play(s.au);
  }

  else if(s.t==='outro'){
    var d3=el('div','ix center');
    d3.innerHTML =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>All set</div>'+
      '<h1 class="hl">You\'re ready to manage exceptions and escalations.</h1>'+
      '<p class="sub">You now know how to recognize when to escalate, submit a support ticket, and loop in your Account Coordinator with the ticket number. Head to the Knowledge Check next — you\'ll walk through a full scenario, take a short quiz, and earn your certificate of completion.</p>'+
      '</div>';
    stage.appendChild(d3);
    next.disabled = false;
    play(s.au);
  }
}

function finish(){ window.location.href='../../Begin-Training.html'; }

function revealTip(s,wrap,btn){
  if(answered[i]) return;
  answered[i] = true;
  btn.remove();
  showAns(s,wrap);
  play(s.auReveal);
  next.disabled=false;
}
function showAns(s,wrap){
  if(!wrap.querySelector('.answer')){
    var a=el('div','answer'); a.innerHTML=s.reveal; wrap.appendChild(a);
  }
}

next.onclick=function(){ if(i<SCREENS.length-1){ i++; render(); } else { finish(); } };
back.onclick=function(){ if(i>0){ i--; render(); } };

document.getElementById('startBtn').onclick=function(){
  document.getElementById('startOverlay').classList.add('hide');
  render();
};
</script>
</body>
</html>
