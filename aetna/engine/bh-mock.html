<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}body.guided .trainees { display: none; }
</style></head><body>
<title>Benefits Hub</title><link rel="icon" type="image/png" href="../assets/img/favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700&family=Francois+One&display=swap">
<style>
/* Layout: a faithful copy of the Benefits Hub web app (green bar, cream page, white cards),
   with a thin training bar above it and a slide-out guide. Single light look, like the real app. */
:root {
  color-scheme: light;
  --green: #003322;
  --green-2: #0b4a35;
  --yellow: #f0ee8c;
  --gold: #ffd646;
  --tile-on: #e6ea82;
  --bg: #fcf7ee;
  --paper: #ffffff;
  --ink: #262626;
  --ink-2: #26262699;
  --line: #e6e1d6;
  --head: #f5f5f5;
  --orange: #e8680c;
  --ok: #2e7d32;
  --err: #c62828;
  --info: #0277bd;
  --svc: #f1f6f8;
  --new: #7a3fd1;
  --new-bg: #efe6fb;
  --font: "Karla", "Roboto", "Helvetica", "Arial", sans-serif;
  --display: "Schibsted Grotesk", "Karla", "Helvetica", sans-serif;
  --logo: "Francois One", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #1f1f1f; }

/* training bar (not part of BH) */
.tbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #1f1f1f; color: #f3f3f3; font-size: 13px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tbar strong { color: var(--yellow); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.tbar .sp { flex: 1; }
.tbtn { background: transparent; border: 1px solid #ffffff40; color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.tbtn:hover { background: #ffffff18; }
.switch { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.switch input { accent-color: var(--new); }

/* BH header */
.bh-head { background: var(--green); height: 70px; display: flex; align-items: center; justify-content: space-between;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); box-shadow: 0 2px 4px #0003; }
.logo { display: flex; align-items: center; gap: 6px; color: var(--yellow); font-family: var(--logo); font-size: 25px; letter-spacing: -.01em; background: none; border: 0; padding: 0; }
.logo svg { width: 26px; height: 30px; }
.hicons { display: flex; gap: 22px; align-items: center; }
.hicon { position: relative; background: none; border: 0; color: var(--yellow); padding: 4px; display: grid; place-items: center; }
.hicon svg { width: 26px; height: 26px; }
.badge { position: absolute; top: -6px; right: -8px; background: #d32f2f; color: #fff; font-size: 11px; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; }
.wrap { max-width: 1440px; margin: 0 auto; }
.narrow { max-width: 1120px; margin: 0 auto; }
h1.member { font-family: var(--display); font-weight: 600; font-size: 34px; letter-spacing: -.01em; margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 15px; }
.card { background: var(--paper); border-radius: 10px; box-shadow: 0 1px 3px #00000014; padding: 18px 22px; min-width: 0; }
.card h2 { font-size: 21px; font-weight: 600; margin: 0 0 18px; letter-spacing: .01em; }
.card h3 { font-size: 19px; font-weight: 600; margin: 0 0 12px; }
.grid-member { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; margin-top: 36px; align-items: start; }
.stack { display: grid; gap: 24px; min-width: 0; }
@media (max-width: 960px) { .grid-member { grid-template-columns: minmax(0, 1fr); } }

.ov { display: grid; grid-template-columns: 140px minmax(0,1fr) 150px minmax(0,1fr); gap: 16px 12px; padding: 0 10px 6px; font-size: 15px; }
.ov dt { color: var(--ink); }
.ov dd { margin: 0; font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 760px) { .ov { grid-template-columns: 120px minmax(0,1fr); } }
.edit-ico { background: none; border: 0; padding: 2px; color: var(--ink-2); display: inline-grid; }
.edit-ico svg { width: 16px; height: 16px; }
.inl { display: flex; gap: 6px; align-items: center; }
.inl input { border: 1px solid #bbb; border-radius: 4px; padding: 4px 8px; width: 180px; max-width: 100%; }

.recent { font-size: 14px; }
.recent .t { display: flex; gap: 14px; align-items: center; font-size: 15px; margin-bottom: 26px; }
.recent .t svg { width: 22px; height: 22px; color: var(--green); }
.recent h4 { margin: 0 0 6px; font-weight: 500; font-size: 15px; }
.recent p { margin: 0 0 3px; color: var(--ink-2); }

.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { width: 190px; height: 98px; background: var(--paper); border: 1px solid #d6d6d6; border-radius: 4px; display: grid; place-items: center; align-content: center; gap: 10px; padding: 8px; font-size: 14.5px; box-shadow: 0 1px 2px #0000000d; }
.tile svg { width: 30px; height: 30px; color: #2b2b2b; }
.tile span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.on { background: var(--tile-on); border-color: var(--green); }
.tile:hover:not(.on) { background: #fafaf3; }
.hint { color: var(--ink-2); text-align: center; padding: 26px 0 30px; }

.authrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) auto; gap: 8px; align-items: end; margin: 10px 0 22px; }
.authrow .k { color: var(--ink-2); font-size: 14px; }
.authrow .v { font-size: 15px; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) { .authrow { grid-template-columns: repeat(3, minmax(0,1fr)); } .authrow .btncell { grid-column: 1 / -1; } }

.btn { border-radius: 999px; border: 0; padding: 9px 18px; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.btn-primary { background: var(--green); color: var(--yellow); box-shadow: 0 2px 4px #0003; }
.btn-primary:hover { background: var(--green-2); }
.btn-primary:disabled { background: #e0e0e0; color: #9e9e9e; box-shadow: none; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1px solid var(--green); color: var(--green); font-weight: 500; }
.btn-danger { background: transparent; border: 1px solid #e57373; color: var(--err); font-weight: 500; }
.btn-text { background: none; border: 0; color: var(--green); font-weight: 700; padding: 8px 10px; }
.btn-sm { padding: 5px 12px; font-size: 13.5px; }
.btn-sec { background: var(--gold); color: var(--green); }

.tscroll { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { background: var(--head); text-align: left; font-weight: 700; padding: 14px 12px; white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
tr.click:hover td { background: #fafafa; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.c { text-align: center; }

.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.new { background: #e3f2fd; color: #0d47a1; }
.chip.active { background: #e8f5e9; color: #1b5e20; }
.chip.hold { background: #fff3e0; color: #b45309; }
.chip.closed { background: #eeeeee; color: #555; }
.chip.fail { background: #ffebee; color: #b71c1c; }
.chip.done { background: #e0f2f1; color: #00695c; }

.actbtns { display: grid; gap: 6px; justify-items: center; }
.actbtn { border-radius: 999px; border: 0; padding: 4px 10px 4px 14px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; min-width: 76px; justify-content: center; }
.actbtn.add { background: var(--green); color: var(--yellow); }
.actbtn.view { background: var(--gold); color: var(--green); }
.actbtn svg { width: 18px; height: 18px; }
.menu { position: absolute; z-index: 40; background: #fff; border-radius: 6px; box-shadow: 0 6px 18px #0003; min-width: 210px; padding: 6px 0; }
.menu button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 9px 16px; font-size: 14.5px; gap: 8px; align-items: center; }
.menu button:hover { background: #f5f5f5; }

.exp { background: #fff; padding: 18px 6px 8px; }
.exp-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 28px; }
@media (max-width: 860px) { .exp-grid { grid-template-columns: minmax(0,1fr); } }
.kv { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 8px 12px; font-size: 14.5px; }
.kv .k { color: var(--ink-2); font-weight: 500; }
.kv .v { min-width: 0; overflow-wrap: anywhere; }
.kd { display: grid; gap: 8px; font-size: 14.5px; }
.kd div { display: flex; justify-content: space-between; gap: 12px; }
.kd .k { color: var(--ink-2); }
.enc { display: flex; justify-content: space-around; text-align: center; margin: 8px 0 12px; }
.enc b { display: block; font-size: 24px; font-weight: 600; }
.enc span { color: var(--ink-2); font-size: 13px; }
.bar { height: 8px; border-radius: 4px; background: #eee; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
hr.d { border: 0; border-top: 1px solid #e0e0e0; margin: 20px 0; }
.narr { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; min-height: 48px; white-space: pre-line; font-size: 14.5px; }
.narr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.foot { color: var(--ink-2); font-size: 13.5px; border-top: 1px solid #eee; padding-top: 12px; margin-top: 16px; }

/* add referral */
.pagehead { display: flex; gap: 22px; align-items: center; margin-bottom: 26px; }
.back { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #d0d0d0; background: transparent; display: grid; place-items: center; flex: none; }
.back svg { width: 22px; height: 22px; color: #555; }
.pagehead h1 { font-family: var(--font); font-weight: 600; font-size: 34px; margin: 0; letter-spacing: .01em; }
.ar-top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 26px; margin-bottom: 26px; }
@media (max-width: 860px) { .ar-top { grid-template-columns: minmax(0,1fr); } }
.bs { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 4px; }
.bs b { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bs .o { color: var(--orange); } .bs .g { color: var(--ok); }
.bs span { color: var(--ink-2); font-size: 13px; }
.bs-bar { height: 6px; border-radius: 3px; background: #e0e0e0; margin: -4px 0 18px; overflow: hidden; }
.bs-bar i { display: block; height: 100%; background: var(--ok); }
.svc-title { font-size: 21px; font-weight: 600; margin: 8px 0 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.link { color: var(--green); text-decoration: underline; background: none; border: 0; padding: 0; font-size: 15px; font-weight: 500; }
.filters { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; }
@media (max-width: 700px) { .filters { grid-template-columns: minmax(0,1fr); } }
.fld { position: relative; }
.fld label.float { position: absolute; top: -9px; left: 10px; background: #fff; padding: 0 4px; font-size: 12.5px; color: var(--ink-2); }
.fld select, .fld input.big { width: 100%; height: 56px; border: 1px solid #c4c4c4; border-radius: 4px; padding: 0 14px; background: #fff; font-size: 16px; }
.fld input.big.focus, .fld input.big:focus { border: 2px solid var(--green); outline: none; }
.opts { position: absolute; left: 0; right: 0; top: 58px; background: #fff; border-radius: 4px; box-shadow: 0 6px 18px #0003; z-index: 30; max-height: 280px; overflow: auto; }
.opts button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 16px; }
.opts button:hover { background: #f5f5f5; }
.opts small { display: block; color: var(--ink-2); }
.ssd { background: var(--svc); border: 1px solid #dfe8ec; border-radius: 8px; padding: 18px 22px; margin: 20px 0; }
.ssd-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; font-size: 14.5px; }
.ssd-grid b { display: block; margin-bottom: 4px; }
.ssd-grid span { color: var(--ink-2); }
@media (max-width: 760px) { .ssd-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.q { margin-bottom: 20px; }
.q > label, .q .ql { display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.q .req { color: var(--err); margin-left: 3px; }
.q input[type=text], .q input[type=date], .q input[type=number], .q select, .q textarea { width: 100%; min-height: 46px; border: 1px solid #c4c4c4; border-radius: 4px; padding: 10px 14px; background: #fff; font-size: 15.5px; }
.q textarea { min-height: 90px; resize: vertical; }
.q .help { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.q .err { color: var(--err); font-size: 13px; margin-top: 4px; }
.ms { position: relative; }
.ms-box { width: 100%; min-height: 46px; border: 1px solid #c4c4c4; border-radius: 4px; padding: 10px 40px 10px 14px; background: #fff; text-align: left; font-size: 15px; position: relative; }
.ms-box::after { content: ""; position: absolute; right: 16px; top: 20px; border: 5px solid transparent; border-top-color: #666; }
.ms-list { position: absolute; left: 0; right: 0; top: calc(100% + 2px); background: #fff; box-shadow: 0 6px 18px #0003; border-radius: 4px; max-height: 340px; overflow: auto; z-index: 30; padding: 6px 0; }
.ms-list label { display: flex; gap: 10px; padding: 8px 14px; align-items: flex-start; font-size: 14.5px; cursor: pointer; }
.ms-list label:hover { background: #f5f5f5; }
.ms-list input { margin-top: 3px; accent-color: var(--green); }
.ms-list small { display: block; color: var(--ink-2); }
.grp { border: 1px dashed #cfd8dc; border-radius: 8px; padding: 14px 16px 2px; margin-bottom: 20px; }
.grp-t { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 14px; }
.order { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 16px; }
.qty { display: flex; gap: 10px; align-items: center; }
.qty input { width: 80px; height: 46px; border: 1px solid #c4c4c4; border-radius: 4px; text-align: center; font-size: 16px; }
.qty button { background: none; border: 0; font-size: 26px; width: 34px; color: #666; }
.tp { text-align: right; } .tp b { display: block; font-weight: 600; margin-bottom: 8px; }
.alert { border-radius: 6px; padding: 12px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
.alert.info { background: #e5f6fd; color: #014361; }
.alert.warn { background: #fff4e5; color: #663c00; }
.alert svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }

/* cart */
.cart-tbl th, .cart-tbl td { padding: 16px 20px; }
.cart-tot { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
.cart-tot h3 { margin: 0; font-size: 24px; font-weight: 600; }
.cart-tot .btns { display: flex; gap: 18px; flex-wrap: wrap; }
.iconbtn { background: none; border: 0; padding: 4px; display: inline-grid; }
.iconbtn svg { width: 24px; height: 24px; }
.grouphead { padding: 12px 20px; background: #fbfbf6; font-weight: 600; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

/* home */
.home { display: grid; place-items: center; align-content: center; min-height: 58vh; gap: 30px; text-align: center; }
.home h1 { font-family: var(--display); font-size: clamp(30px, 5vw, 50px); font-weight: 600; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.search { width: min(600px, 100%); position: relative; }
.search input { width: 100%; height: 56px; border-radius: 999px; border: 1px solid #ddd; padding: 0 56px 0 22px; font-size: 16px; background: #fff; box-shadow: 0 1px 4px #0000000f; }
.search button { position: absolute; right: 10px; top: 8px; border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; }
.search svg { width: 26px; height: 26px; color: #555; }
.trainees { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
.trainee { border: 1px dashed #b9b3a3; background: #fffdf8; border-radius: 999px; padding: 6px 14px; font-size: 13.5px; }
.trainee b { font-variant-numeric: tabular-nums; }
.results { width: min(760px, 100%); text-align: left; }

/* dialogs, toasts */
.scrim { position: fixed; inset: 0; background: #0006; z-index: 70; display: grid; place-items: center; padding: 16px; }
.dlg { background: #fff; border-radius: 10px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 12px 40px #0005; }
.dlg h2 { font-size: 20px; font-weight: 600; margin: 0; padding: 20px 24px 8px; }
.dlg .body { padding: 8px 24px 12px; font-size: 15px; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); z-index: 80; display: grid; gap: 8px; max-width: min(460px, calc(100% - 40px)); }
.toast { border-radius: 6px; padding: 12px 16px; color: #fff; box-shadow: 0 4px 12px #0004; font-size: 14.5px; white-space: pre-wrap; display: flex; gap: 12px; align-items: flex-start; }
.toast.ok { background: #2e7d32; } .toast.err { background: #d84315; } .toast.info { background: #0277bd; }
.toast button { background: none; border: 0; color: #fff; margin-left: auto; font-size: 16px; line-height: 1; }

/* 2027 notes */
.nb { display: none; vertical-align: middle; margin-left: 6px; background: var(--new-bg); color: var(--new); border: 1px solid #d6c4f4; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 8px; letter-spacing: .03em; cursor: help; position: relative; white-space: nowrap; font-family: var(--font); line-height: 1.6; }
body.notes .nb { display: inline-block; }
body.notes .newwrap { outline: 2px dashed #b99be9; outline-offset: 4px; border-radius: 6px; }
.nb:hover::after, .nb:focus::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); width: 280px; max-width: 70vw; background: #2a1650; color: #fff; padding: 9px 11px; border-radius: 6px; font-weight: 500; font-size: 12.5px; letter-spacing: 0; white-space: normal; z-index: 90; line-height: 1.4; text-transform: none; }

/* guide drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; z-index: 75; box-shadow: -8px 0 30px #0003; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
.drawer header h2 { margin: 0; font-size: 18px; }
.drawer .dbody { overflow: auto; padding: 14px 20px 30px; }
.scn { border: 1px solid #e7e2d6; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.scn h3 { margin: 0 0 4px; font-size: 15.5px; }
.scn p { margin: 0 0 8px; color: #555; font-size: 13.5px; }
.scn ol { margin: 0 0 10px; padding-left: 20px; font-size: 13.5px; display: grid; gap: 3px; }
.scn .meta { font-size: 12px; color: var(--ink-2); }
.legend { background: var(--new-bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #3d2470; margin-bottom: 14px; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(30px); opacity: .6 } } }
</style>

let S;
let nextRef = 52001, nextAuth = 70101;
function buildState() {
  nextRef = 52001; nextAuth = 70101;
  const members = CONFIG.members.map((m) => {
    const auths = m.programs.map((pk) => ({ id: nextAuth++, program: pk, allowance: CONFIG.programs[pk].hours, topUps: 0 }));
    const referrals = m.referrals.map(([pk, rec, status, hours, used, x = {}]) => {
      const r = newReferral(m, auths.find((a) => a.program === pk), rec, hours, {});
      Object.assign(r, { status, used, provider: x.provider || "Not yet assigned", discharge: x.discharge || "", answers: {} });
      if (x.dx) r.answers.dx = x.dx;
      if (x.facility) r.answers.facility = x.facility;
      r.expires = computeExpiry(r);
      r.narrative = "Referral created for training.";
      return r;
    });
    return { ...m, auths, referrals };
  });
  return { route: { name: "home" }, members, cart: [], tile: {}, expanded: null, notes: false, guide: false, search: "" };
}
function newReferral(m, auth, received, hours, answers) {
  return { id: nextRef++, member: m.id, auth: auth.id, program: auth.program, received, status: "New", hours, used: 0,
    provider: "Not yet assigned", answers, discharge: "", narrative: "", docs: [], notes: [], holdUntil: "", createdBy: `${CONFIG.caseManager.first} ${CONFIG.caseManager.last}` };
}
function computeExpiry(r) {
  const p = CONFIG.programs[r.program];
  if (p.expiry === "yearEnd") return yearEnd(r.received);
  if (p.expiry === "quarterEnd") return quarterEnd(r.received);
  if (p.expiry === "submitPlus30") return addDays(r.received, 30);
  if (p.expiry === "dischargePlus30") { const e = addDays(r.discharge || r.received, 30); const ye = yearEnd(r.received); return e > ye ? ye : e; }
  return yearEnd(r.received);
}
const member = (id) => S.members.find((m) => m.id === id);
const authOf = (m, id) => m.auths.find((a) => a.id === id);
function balance(m, auth) {
  const refs = m.referrals.filter((r) => r.auth === auth.id);
  const used = refs.reduce((s, r) => s + r.used, 0);
  const pending = refs.filter((r) => OPEN.has(r.status)).reduce((s, r) => s + Math.max(0, r.hours - r.used), 0);
  const expired = refs.reduce((s, r) => s + (r.expiredHours || 0), 0);
  return { allowance: auth.allowance, used, pending, remaining: auth.allowance - used - pending - expired };
}

/* ------------------------------ ui helpers ------------------------------ */
function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="Dismiss">×</button>`;
  el.querySelector("button").onclick = () => el.remove();
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 9000 : 4500);
}
function dialog(html, onMount) {
  const layer = $("#layer");
  layer.innerHTML = `<div class="scrim" role="dialog" aria-modal="true"><div class="dlg">${html}</div></div>`;
  const scrim = layer.firstElementChild;
  scrim.addEventListener("click", (e) => { if (e.target === scrim) closeDialog(); });
  onMount && onMount(scrim);
  const f = scrim.querySelector("input, select, textarea, button.btn-primary");
  f && f.focus();
}
function closeDialog() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDialog(); closeMenus(); } });
function closeMenus() { document.querySelectorAll(".menu").forEach((m) => m.remove()); }
document.addEventListener("click", (e) => { if (!e.target.closest(".menu") && !e.target.closest("[data-menu]")) closeMenus(); });
function go(route) { S.route = route; closeMenus(); render(); window.scrollTo(0, 0); }
function chip(status) {
  const cls = { "New": "new", "Pending Assignment": "new", "Accepted By Provider": "active", "On Hold": "hold", "Completed": "done", "Closed": "closed", "Eligibility Failed": "fail", "Member Declined Service": "closed" }[status] || "closed";
  return `<span class="chip ${cls}">${esc(status)}</span>`;
}

/* ------------------------------ screens ------------------------------ */
function render() {
  $("#cartBadge").hidden = S.cart.length === 0;
  $("#cartBadge").textContent = S.cart.length;
  document.body.classList.toggle("notes", S.notes);

  bind();
}

const NARR_MAX = 250;
const NARR_POINTER = "Providers - please review Service Detail Questions for care guidance.";
const narrPrefix = (svc) => (svc.sdqs.length ? `${NARR_POINTER}\n` : "");
function narrField(id, svc, val) {
  const room = NARR_MAX - narrPrefix(svc).length;
  return `${svc.sdqs.length ? `<div class="narr" style="min-height:0;margin-bottom:6px;color:var(--ink-2)">${esc(NARR_POINTER)}</div>` : ""}<textarea id="${id}" maxlength="${room}" aria-describedby="${id}-c">${esc(val)}</textarea><div id="${id}-c" class="help" style="color:var(--ink-2);font-size:13px;text-align:right">${(val || "").length}/${room}</div>`;
}
const narrBody = (svc, narr) => (narr.startsWith(NARR_POINTER) ? narr.slice(narrPrefix(svc).length) : narr);
function previewExpiry(p, f) {
  const t = CONFIG.today;
  if (p.expiry === "yearEnd") return `This referral will expire on <b>${fmt(yearEnd(t))}</b>, the end of the plan year. Hours don't roll over.`;
  if (p.expiry === "quarterEnd") return `This referral will expire on <b>${fmt(quarterEnd(t))}</b>, the end of ${quarterOf(t)}. Hours don't roll over to the next quarter.`;
  if (p.expiry === "submitPlus30") return `This referral will expire on <b>${fmt(addDays(t, 30))}</b>, 30 days after submission (day one is tomorrow).`;
  return `This referral will expire on <b>${fmt(addDays(t, 30))}</b>, 30 days after submission. When the confirmed discharge date is recorded, it moves to 30 days after discharge (day one is the day after discharge).`;
}

function sdqField(key, f) {
  const def = CONFIG.sdqs[key];
  if (def.group) return pointPersonFields(f);
  return questionHTML(key, def, f.answers[key], f);
}
function questionHTML(key, def, val, f) {
  const id = `q-${key}`;
  const req = def.required ? `<span class="req">*</span>` : "";
  let control = "";
  if (def.type === "Text") control = `<input type="text" id="${id}" data-ans="${key}" value="${esc(val || "")}" placeholder="Enter your answer">`;
  else if (def.type === "Date") control = `<input type="date" id="${id}" data-ans="${key}" value="${esc(val || "")}">`;
  else if (def.type === "DropDown") control = `<select id="${id}" data-ans="${key}"><option value=""></option>${def.options.map((o) => `<option ${val === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (def.type === "Multiple") {
    const items = CONFIG.lists[def.list];
    const sel = val || [];
    control = `<div class="ms"><button type="button" class="ms-box" id="${id}" data-ms="${key}" aria-expanded="${f.msOpen === key}">${sel.length ? esc(sel.join(", ")) : "&nbsp;"}</button>
      ${f.msOpen === key ? `<div class="ms-list">${items.map(([t, sub]) => `<label><input type="checkbox" data-msitem="${key}" value="${esc(t)}" ${sel.includes(t) ? "checked" : ""}><span>${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></label>`).join("")}</div>` : ""}</div>`;
  }
  const minErr = def.min && val && val.length > 0 && val.length < def.min ? `<div class="err">Select at least ${def.min}.</div>` : "";
  return `<div class="q"><label for="${id}">${esc(def.q)}${req}${def.rule ? nb("adlMin") : def.ssbci ? nb("ssbci") : nb(def.assumed ? "sdqAssumed" : "sdq", def.assumed ? "Assumed" : "")}</label>${control}${def.help ? `<div class="help">${esc(def.help)}</div>` : ""}${minErr}</div>`;
}
function pointPersonFields(f) {
  const block = (n) => CONFIG.pointPerson.map((pp) => questionHTML(`pp${n}_${pp.k}`, { q: pp.q.replace("{n}", n), type: pp.type, options: pp.options, required: n === 1 && pp.req1, help: n === 1 ? pp.help1 : "" }, f.answers[`pp${n}_${pp.k}`], f)).join("");
  return `${block(1)}
    ${f.morePP ? `${block(2)}${block(3)}` : `<p style="margin:0 0 20px"><button class="link" data-more-pp type="button">Show questions for point person 2 and 3 (optional)</button></p>`}`;
}
function formValid(svc, f) {
  if (!f.qty || f.qty < 1) return false;
  for (const k of svc.sdqs) {
    if (k === "pp") { for (const pp of CONFIG.pointPerson) if (pp.req1 && !f.answers[`pp1_${pp.k}`]) return false; continue; }
    const d = CONFIG.sdqs[k]; const v = f.answers[k];
    if (d.required && (!v || (Array.isArray(v) && !v.length))) return false;
    if (d.min && (!v || v.length < d.min)) return false;
  }
  return true;
}

/* ------------------------------ behaviour ------------------------------ */
function itemCost(m, authId) { const a = authOf(m, authId); const p = CONFIG.programs[a.program]; const r = balance(m, a).remaining; return r > 0 && r < p.hours ? r : p.hours; }
function startAdd(m, authId) {
  S.form = { svc: false, svcOpen: false, answers: {}, narr: "", qty: itemCost(m, authId), zip: m.zip, addr: m.addr, city: m.city, state: m.state, msOpen: null, morePP: false, error: "" };
  go({ name: "add", id: m.id, auth: authId });
}
function onAddReferral(m, authId) {
  const a = authOf(m, authId);
  const p = CONFIG.programs[a.program];
  const b = balance(m, a);
  if (!p.topUp || b.remaining >= p.hours) return startAdd(m, authId);
  dialog(`<h2>Does this member need a new post-discharge referral? ${nb("topUp")}</h2>
    <div class="body"><p style="margin-top:4px">${esc(m.first)} ${esc(m.last)} has <b>${b.remaining} of ${p.hours} hours</b> left on ${esc(p.label)}.</p>

    <div class="acts">${b.remaining > 0 ? `<button class="btn btn-text" data-tu="no" type="button">No, use remaining ${b.remaining} hours</button>` : ""}<button class="btn btn-primary" data-tu="yes" type="button">Yes, new discharge</button></div>`, (el) => {
    el.querySelector('[data-tu="yes"]').onclick = () => { a.allowance += p.hours - b.remaining; a.topUps++; closeDialog(); toast(`Hours topped up to ${p.hours} for this new discharge.`); startAdd(m, authId); };
    el.querySelector('[data-tu="no"]') && (el.querySelector('[data-tu="no"]').onclick = () => { closeDialog(); startAdd(m, authId); });
  });
}

function refAction(m, r, act) {
  const svc = CONFIG.services[CONFIG.programs[r.program].service];
  if (act === "note") dialog(`<h2>Add Note to Referral</h2><div class="body"><div class="q"><label for="noteType">Note Type<span class="req">*</span></label><select id="noteType"><option value=""></option>${NOTE_TYPES.map((x) => `<option>${esc(x)}</option>`).join("")}</select></div><div class="q"><label for="noteText">Note</label><textarea id="noteText"></textarea></div></div><div class="acts"><button class="btn btn-text" data-x type="button">Cancel</button><button class="btn btn-primary" id="saveNote" type="button">Save Note</button></div>`, (el) => {
    el.querySelector("[data-x]").onclick = closeDialog;
    el.querySelector("#saveNote").onclick = () => { const t = el.querySelector("#noteText").value.trim(), ty = el.querySelector("#noteType").value; if (!t || !ty) return; r.notes.push({ t, ty, d: CONFIG.today }); closeDialog(); toast("Note added."); render(); };
  });
  if (act === "doc") dialog(`<h2>Add Document</h2><div class="body"><p style="margin-top:0">Proof of POA / TPA, a discharge summary or authorization paperwork. Documents are visible to the THB coordinator.</p><div class="q"><label for="docFile">File</label><input type="file" id="docFile"></div><p class="help" style="color:var(--ink-2);font-size:13px">Training mock: the file stays on this device and only its name is shown.</p></div><div class="acts"><button class="btn btn-text" data-x type="button">Cancel</button><button class="btn btn-primary" id="saveDoc" type="button">Upload</button></div>`, (el) => {
    el.querySelector("[data-x]").onclick = closeDialog;
    el.querySelector("#saveDoc").onclick = () => { const f = el.querySelector("#docFile").files[0]; r.docs.push(f ? f.name : "discharge-summary.pdf"); closeDialog(); toast("Document uploaded."); S.expanded = r.id; render(); };
  });
  if (act === "discharge") {
    const preview = (v) => { if (!v) return { html: "", ok: false, warn: false };
      const next = computeExpiry({ ...r, discharge: v }); const cur = r.expires;
      if (v > CONFIG.today) return { html: `<div class="alert warn">${ICONS.info}<div>The discharge date can't be in the future.</div></div>`, ok: false };
      if (next < CONFIG.today) return { html: `<div class="alert warn">${ICONS.info}<div>This date would make the referral already expired. Contact THB.</div></div>`, ok: false };
      const base = `<div class="alert info">${ICONS.info}<div>Expiration will change from <b>${fmt(cur)}</b> to <b>${fmt(next)}</b>.</div></div>`;
      if (cur && next < cur) return { html: base + `<div class="alert warn">${ICONS.info}<div>This moves the expiration earlier than it is today. Save only if the member was discharged before the referral was created.</div></div>`, ok: true, warn: true };
      return { html: base, ok: true, warn: false }; };
    dialog(`<h2>Discharge date ${nb("discharge")}</h2><div class="body"><p style="margin-top:0">Record the date the member was discharged to home. The referral expires 30 days after it.</p><div class="q"><label for="dDate">Discharged to home<span class="req">*</span></label><input type="date" id="dDate" max="${CONFIG.today}" value="${esc(r.discharge || "")}"></div><div id="dPrev"></div></div><div class="acts"><button class="btn btn-text" data-x type="button">Cancel</button><button class="btn btn-primary" id="saveD" type="button" disabled>Save</button></div>`, (el) => {
      el.querySelector("[data-x]").onclick = closeDialog;
      const inp = el.querySelector("#dDate"), btn = el.querySelector("#saveD");
      const upd = () => { const pv = preview(inp.value); el.querySelector("#dPrev").innerHTML = pv.html; btn.disabled = !pv.ok; btn.textContent = pv.warn ? "Save anyway" : "Save"; };
      inp.oninput = inp.onchange = upd; upd();
      btn.onclick = () => { const v = inp.value; if (!preview(v).ok) return; r.discharge = v; r.expires = computeExpiry(r); refreshHold(m, r); closeDialog(); toast(`Discharge date saved. Referral expires ${fmt(r.expires)}.`); S.expanded = r.id; render(); };
    });
  }
  if (act === "narr") { S.expanded = r.id; S.editNarr = r.id; render(); $("#narrInput") && $("#narrInput").focus(); bindNarr(); }
  if (act === "notes") dialog(`<h2>Notes - Referral #${r.id}</h2><div class="body">${r.notes.length ? r.notes.map((n) => `<p><b>${fmt(n.d)}</b> ${n.ty ? `<i>${esc(n.ty)}</i>: ` : ""}${esc(n.t)}</p>`).join("") : "<p>No notes yet.</p>"}</div><div class="acts"><button class="btn btn-primary" data-x type="button">Close</button></div>`, (el) => el.querySelector("[data-x]").onclick = closeDialog);
  if (act === "docs") dialog(`<h2>Documents - Referral #${r.id}</h2><div class="body">${r.docs.length ? `<ul>${r.docs.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : "<p>No documents yet.</p>"}</div><div class="acts"><button class="btn btn-primary" data-x type="button">Close</button></div>`, (el) => el.querySelector("[data-x]").onclick = closeDialog);
  if (act === "sdq") showSdq(svc, r.answers, `SDQ Answers - ${svc.name}`);
  if (act === "track") {
    const url = `${CONFIG.trackingBase}TEST-${r.id}`;
    const done = () => toast("Tracking link copied. Members and families can open it without logging in.", "info");
    try { navigator.clipboard.writeText(url).then(done, () => showLink(url)); } catch { showLink(url); }
  }
}
function bindNarr() { const t = $("#narrInput"); if (t) t.oninput = () => { $("#narrInput-c").textContent = `${t.value.length}/${t.maxLength}`; }; }
function showLink(url) { dialog(`<h2>Tracking link</h2><div class="body"><p>Copy this link:</p><input class="big" style="width:100%;height:44px;border:1px solid #ccc;border-radius:4px;padding:0 10px" value="${esc(url)}" readonly onfocus="this.select()"></div><div class="acts"><button class="btn btn-primary" data-x type="button">Done</button></div>`, (el) => el.querySelector("[data-x]").onclick = closeDialog); }
function showSdq(svc, answers, title) {
  const rows = [];
  svc.sdqs.forEach((k) => {
    if (k === "pp") { [1, 2, 3].forEach((n) => CONFIG.pointPerson.forEach((pp) => { const v = answers[`pp${n}_${pp.k}`]; if (v) rows.push([pp.q.replace("{n}", n), v]); })); return; }
    const v = answers[k]; if (v && (!Array.isArray(v) || v.length)) rows.push([CONFIG.sdqs[k].q, Array.isArray(v) ? v.join(", ") : CONFIG.sdqs[k].type === "Date" ? fmt(v) : v]);
  });
  dialog(`<h2>${esc(title)}</h2><div class="body">${rows.length ? rows.map(([q, a]) => `<div style="margin-bottom:12px"><div style="color:var(--ink-2);font-size:13.5px;font-weight:500">${esc(q)}</div><div>${esc(a)}</div></div>`).join("") : '<p style="color:var(--ink-2)">No answers recorded.</p>'}</div><div class="acts"><button class="btn btn-primary" data-x type="button">Close</button></div>`, (el) => el.querySelector("[data-x]").onclick = closeDialog);
}
function refreshHold(m, rah) {
  if (!CONFIG.programs[rah.program].pausesIHSPC || !rah.expires) return;
  m.referrals.forEach((x) => { if (x.status === "On Hold") x.holdUntil = addDays(rah.expires, 1); });
}

function addToCart() {
  const m = member(S.route.id);
  const a = authOf(m, S.route.auth);
  const b = balance(m, a);
  const f = S.form;
  const inCart = S.cart.filter((i) => i.auth === a.id).reduce((s, i) => s + i.qty, 0);
  if (f.qty > b.remaining - inCart) { f.error = `Insufficient points: this referral costs ${f.qty} points and ${b.remaining - inCart} are available.`; return render(); }
  S.cart.push({ key: `${Date.now()}`, member: m.id, auth: a.id, program: a.program, qty: f.qty, answers: structuredClone(f.answers), narr: f.narr, addr: f.addr, city: f.city, state: f.state, zip: f.zip });
  toast("Added to cart.");
  go({ name: "cart" });
}

function checkoutErrors() {
  const errs = [];
  S.cart.forEach((it) => {
    const m = member(it.member); const p = CONFIG.programs[it.program];
    const same = m.referrals.filter((r) => r.program === it.program);
    if (p.onePer === "quarter") {
      const hit = same.find((r) => OPEN.has(r.status) && quarterOf(r.received) === quarterOf(CONFIG.today));
      if (hit) errs.push(`Auth ${it.auth}: Eligibility fail. Companion Care allows one referral per member per calendar quarter. Referral #${hit.id} is already open for ${quarterOf(CONFIG.today)}.`);
    }
    if (p.onePer === "year") {
      const hit = same.find((r) => OPEN.has(r.status) && r.received.slice(0, 4) === CONFIG.today.slice(0, 4));
      if (hit) errs.push(`Auth ${it.auth}: Eligibility fail. ${p.label} allows one referral per member per year on this plan. Referral #${hit.id} is already open for ${CONFIG.today.slice(0, 4)}.`);
    }
    if (p.oncePerDx && it.answers.dx) {
      const hit = same.find((r) => r.answers.dx === it.answers.dx && r.received.slice(0, 4) === CONFIG.today.slice(0, 4));
      if (hit) errs.push(`Auth ${it.auth}: Recovery at Home allows one referral per qualifying diagnosis per year. "${it.answers.dx.split(": ").pop()}" was already used on referral #${hit.id} in ${CONFIG.today.slice(0, 4)}.`);
    }
  });
  return errs;
}
function doCheckout() {
  dialog(`<h2>Confirm referrals?</h2><div class="body"><p style="margin-top:4px">You're about to submit ${S.cart.length} referral${S.cart.length > 1 ? "s" : ""} for ${S.cart.reduce((s, i) => s + i.qty, 0)} points. THB will contact the member or their point person to confirm interest before any provider outreach.</p></div><div class="acts"><button class="btn btn-text" data-x type="button">Cancel</button><button class="btn btn-primary" id="confirmCo" type="button">Confirm</button></div>`, (el) => {
    el.querySelector("[data-x]").onclick = closeDialog;
    el.querySelector("#confirmCo").onclick = () => {
      const errs = checkoutErrors();
      if (errs.length) { closeDialog(); toast(`Checkout failed:\n${errs.join("\n")}`, "err"); return; }
      let lastMember, lastAuth; const failed = [];
      S.cart.forEach((it) => {
        const m = member(it.member); const a = authOf(m, it.auth); const p = CONFIG.programs[it.program];
        const r = newReferral(m, a, CONFIG.today, it.qty, it.answers);
        const svcN = CONFIG.services[p.service];
        r.narrative = it.narr || svcN.sdqs.length ? narrPrefix(svcN) + (it.narr || "") : ""; r.expires = computeExpiry(r);
        if (p.failPrior) m.referrals.forEach((x) => { if (x.program === it.program && OPEN.has(x.status)) { x.expiredHours = Math.max(0, x.hours - x.used); x.status = "Eligibility Failed"; x.closeReason = `Closed on readmission: new referral #${r.id}`; failed.push(x.id); } });
        m.referrals.push(r);
        if (p.pausesIHSPC) m.referrals.forEach((x) => { if (CONFIG.programs[x.program].service === "IHSPC" && OPEN.has(x.status) && x.status !== "On Hold") { x.status = "On Hold"; x.holdUntil = "rah"; } });
        lastMember = m; lastAuth = a.id; S.expanded = r.id;
      });
      S.cart = []; closeDialog(); toast(failed.length ? `Referrals submitted successfully. Referral #${failed.join(", #")} closed as Eligibility Failed.` : "Referrals submitted successfully");
      S.tile[lastMember.id] = lastAuth;
      go({ name: "member", id: lastMember.id });
    };
  });
}

function bind() {
  const app = $("#app");
  app.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { S.search = ""; go({ name: "member", id: b.dataset.open }); });
  const sf = $("#searchForm");
  if (sf) { sf.onsubmit = (e) => { e.preventDefault(); S.search = $("#memberSearch").value; const exact = S.members.find((m) => m.id === S.search.trim().toUpperCase()); if (exact) { S.search = ""; go({ name: "member", id: exact.id }); } else render(); }; }

  app.querySelectorAll("[data-edit-narr]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); S.editNarr = Number(b.dataset.editNarr); render(); $("#narrInput").focus(); bindNarr(); });
  app.querySelectorAll("[data-cancel-narr]").forEach((b) => b.onclick = () => { S.editNarr = null; render(); });
  app.querySelectorAll("[data-save-narr]").forEach((b) => b.onclick = () => { const m = member(S.route.id); const r = m.referrals.find((x) => x.id === Number(b.dataset.saveNarr)); const sv = CONFIG.services[CONFIG.programs[r.program].service]; r.narrative = narrPrefix(sv) + $("#narrInput").value; S.editNarr = null; toast("Referral narrative updated!"); render(); });
  app.querySelectorAll("[data-edit-contact]").forEach((b) => b.onclick = () => { S.editing = `${S.route.id}:${b.dataset.editContact}`; render(); const i = $(`#ed-${b.dataset.editContact}`); i && i.focus(); });
  app.querySelectorAll("[data-cancel-contact]").forEach((b) => b.onclick = () => { S.editing = null; render(); });
  app.querySelectorAll("[data-save-contact]").forEach((b) => b.onclick = () => { const k = b.dataset.saveContact; member(S.route.id)[k] = $(`#ed-${k}`).value.trim(); S.editing = null; toast("Member contact updated."); render(); });
  app.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => b.dataset.back ? go({ name: "member", id: b.dataset.back }) : go({ name: "home" }));

  if (S.route.name === "add") {
    const f = S.form;
    const svcIn = $("#svcSearch");

    const pick = app.querySelector("[data-pick-svc]");
    if (pick) pick.onclick = () => { f.svc = true; f.svcOpen = false; render(); };

    app.querySelectorAll("[data-ans]").forEach((el) => { if (el.tagName === "SELECT") el.onchange = () => { f.answers[el.dataset.ans] = el.value; f.error = ""; render(); }; });
    app.querySelectorAll("[data-ms]").forEach((b) => b.onclick = () => { f.msOpen = f.msOpen === b.dataset.ms ? null : b.dataset.ms; render(); const l = app.querySelector(".ms-list"); l && l.querySelector("input")?.focus({ preventScroll: true }); });
    app.querySelectorAll("[data-msitem]").forEach((cb) => cb.onchange = () => {

      render(); window.scrollTo(0, y); const l = app.querySelector(".ms-list"); if (l) l.scrollTop = st;

    // Aetna: quantity is always 1 item that costs the full allotment, so there is nothing to type here.
    const atc = $("#addToCart"); if (atc) atc.onclick = addToCart;
    app.querySelector("[data-addr]").onclick = () => addressDialog();
  }
  if (S.route.name === "cart") {
    app.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => { S.cart = S.cart.filter((i) => i.key !== b.dataset.remove); render(); });
    app.querySelectorAll("[data-sdqview]").forEach((b) => b.onclick = () => { const it = S.cart.find((i) => i.key === b.dataset.sdqview); const svc = CONFIG.services[CONFIG.programs[it.program].service]; showSdq(svc, it.answers, `SDQ Answers - ${svc.name}`); });
    const cc = $("#clearCart"); if (cc) cc.onclick = () => { S.cart = []; toast("Cart cleared.", "info"); render(); };
    const co = $("#checkout"); if (co) co.onclick = doCheckout;
  }
}
function refreshValidity() {
  const m = member(S.route.id); const a = authOf(m, S.route.auth);
  const svc = CONFIG.services[CONFIG.programs[a.program].service];

      <div class="q"><label for="a3">City</label><input type="text" id="a3" value="${esc(f.city)}"></div>
      <div class="q"><label for="a4">State</label><input type="text" id="a4" value="${esc(f.state)}"></div>
      <div class="q"><label for="a5">Zip Code</label><input type="text" id="a5" value="${esc(f.zip)}"></div></div></div>
    <div class="acts"><button class="btn btn-text" data-x type="button">Cancel</button><button class="btn btn-primary" id="saveAddr" type="button">Save</button></div>`, (el) => {
    el.querySelector("[data-x]").onclick = closeDialog;
    el.querySelector("#saveAddr").onclick = () => {
      const z = el.querySelector("#a5").value.trim();
      if (!/^\d{5}$/.test(z)) { toast("Invalid zip code", "err"); return; }
      const apt = el.querySelector("#a2").value.trim();
      f.addr = el.querySelector("#a1").value.trim() + (apt ? `, ${apt}` : ""); f.city = el.querySelector("#a3").value.trim(); f.state = el.querySelector("#a4").value.trim(); f.zip = z;
      closeDialog(); toast("Service address updated"); render();
    };
  });
}
