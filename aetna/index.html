<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aetna Benefits Hub Training — Sign In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&display=swap');

  :root {
    --night-black: #000000;
    --charcoal: #2c2c2c;
    --thb-yellow: #FFD646;
    --honeycomb-cream: #F4E3C9;
    --mist-cream: #FCF7EE;
    --forest-green: #003322;
    --meadow-green: #E6EC82;
    --cloud-white: #FFFFFF;
    --border-soft: #e7ddc7;
    --raspberry: #C6144A;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Karla', Arial, sans-serif;
    background: var(--forest-green);
    color: var(--charcoal);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--cloud-white);
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    padding: 40px 36px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .eyebrow {
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--forest-green);
    margin-bottom: 10px;
    text-align: center;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 6px;
    color: var(--night-black);
    text-align: center;
  }

  p.sub {
    margin: 0 0 28px;
    font-size: 14px;
    color: #6b6b6b;
    text-align: center;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--charcoal);
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }

  input:focus {
    outline: 2px solid var(--forest-green);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 13px;
    background: var(--forest-green);
    color: var(--thb-yellow);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }

  button:hover { background: #004d33; }

  .error {
    display: none;
    background: #fdecef;
    color: var(--raspberry);
    border: 1px solid #f3c1cf;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .error.show { display: block; }

  .footnote {
    margin-top: 22px;
    font-size: 12px;
    color: #9a9a9a;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">The Helper Bees</div>
    <h1>Benefits Hub Training</h1>
    <p class="sub">Enter the access code provided by your training coordinator.</p>

    <div class="error" id="errorMsg">That user ID or password isn't correct. Please try again.</div>

    <form id="loginForm" autocomplete="off">
      <label for="userId">User ID</label>
      <input type="text" id="userId" name="userId" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>

    <div class="footnote">Having trouble? Contact your training coordinator.</div>
  </div>

  <script>
    // ---- Shared access credentials -------------------------------------
    // Every case manager uses this same User ID / password. This is a soft
    // access gate for a public site, not real authentication - see the
    // README for how to change these values and what this does and doesn't protect.
    //
    // Values below are SHA-256 hashes, not the plain text, so the credentials
    // aren't sitting in plain view in the page source.
    //
    // To set your own User ID / password, replace CHANGE_ME_USERID and
    // CHANGE_ME_PASSWORD below and run them through any SHA-256 tool
    // (e.g. in a browser console: crypto.subtle.digest(...)), or ask
    // Claude to regenerate this file with new values.
    var VALID_USERID_HASH   = "830a7be4f6592d32ca65117d73a24d8a562548e8501595120008d9644b8b8079";
    var VALID_PASSWORD_HASH = "b1ac46b7fbcc776aaba5017947eefbcef87b1ff7268a8d5f5dbc0ec92aeec95d";

    async function sha256(text) {
      const enc = new TextEncoder().encode(text.trim().toLowerCase());
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;
      const [uHash, pHash] = await Promise.all([sha256(userId), sha256(password)]);

      if (uHash === VALID_USERID_HASH && pHash === VALID_PASSWORD_HASH) {
        try { sessionStorage.setItem('bh_authed', '1'); } catch (err) {}
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'Begin-Training.html';
      } else {
        document.getElementById('errorMsg').classList.add('show');
      }
    });
  </script>

</body>
</html>
