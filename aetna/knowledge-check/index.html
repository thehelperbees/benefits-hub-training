<!doctype html>
<html lang="en">
<head>
<script src="../../gate.js" data-home="../index.html"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<title>Benefits Hub — Knowledge Check | Aetna &amp; The Helper Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/guide.css">
</head>
<body>
<div id="startOverlay">
  <img src="../assets/img/bee-icon.png" alt="" style="width:20px;height:20px;flex:none;">
  <div class="so-brand">The Helper Bees</div>
  <h1>Knowledge Check</h1>
  <p>Four scenarios on the real Benefits Hub screens, a short quiz, and your certificate. Click below to begin with sound.</p>
  <button id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start module</button>
</div>
<div id="app">
  <div class="top">
    <div class="brand">
      <img src="../assets/img/bee-icon.png" alt="" style="width:20px;height:20px;flex:none;">
      <span>The Helper Bees</span>
    </div>
    <div class="track">
      <span class="prog"><i id="bar"></i></span>
      <span class="stepnum" id="stepnum"></span>
    </div>
    <button class="scn-btn" id="scnBtn" type="button">Training scenarios</button>
    <a class="home-link" href="../Begin-Training.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>Training Home</a>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bot">
    <button class="nav back" id="back">Back</button>
    <button class="audiobtn" id="audioToggle" hidden></button>
    <span class="ready-hint" id="readyHint">Ready when you are — select Next to continue.</span>
    <button class="nav next" id="next">Next</button>
  </div>
  <audio id="au"></audio>
</div>
<script src="../engine/steps.js"></script>
<script src="config.js"></script>
<script src="../engine/guide.js"></script>
</body>
</html>
