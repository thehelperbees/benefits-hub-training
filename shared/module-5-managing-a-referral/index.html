<!doctype html>
<html lang="en">
<head>
<script src="../../gate.js" data-home="../../index.html"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benefits Hub — Understanding Benefits, Balances, Referrals, and Notes | The Helper Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#003322; --green-soft:#0B4A36;
    --cream:#FCF7EE; --cream-dim:#F5EEE0;
    --yellow:#FFD646; --lime:#E6EC82; --teal:#82D2CA;
    --peach:#FDA761; --pink:#FEB3D3; --rasp:#CC4983;
    --sand:#E3D7BB; --ink:#0F2E23;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow-x:hidden;background:var(--green);font-family:'Manrope',system-ui,-apple-system,Arial,sans-serif;color:var(--ink);}
  #app{max-width:1080px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:22px 22px 26px;width:100%;box-sizing:border-box;}

  /* ---------- top chrome ---------- */
  .top{display:flex;align-items:center;gap:16px;padding:2px 4px 14px;flex:none;}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .brand svg{width:20px;height:20px;flex:none;}
  .brand span{color:var(--cream);font-weight:800;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;}
  .track{flex:1;display:flex;align-items:center;gap:10px;}
  .prog{flex:1;height:6px;background:rgba(252,247,238,.16);border-radius:6px;overflow:hidden;}
  .prog>i{display:block;height:100%;width:0;background:var(--yellow);border-radius:6px;transition:width .35s ease;}
  .stepnum{font-size:12px;font-weight:700;color:var(--cream);opacity:.55;white-space:nowrap;letter-spacing:.2px;}
  .home-link{display:inline-flex;align-items:center;gap:6px;color:var(--cream);opacity:.72;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px;flex:none;transition:opacity .15s ease,background .15s ease;}
  .home-link:hover{opacity:1;background:rgba(252,247,238,.08);}
  .home-link svg{width:13px;height:13px;flex:none;}

  /* ---------- stage ---------- */
  .stage{flex:1;min-height:0;background:var(--cream);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);}
  .ix{position:absolute;inset:0;overflow-y:auto;padding:22px 50px;box-sizing:border-box;}
  .center{display:flex;flex-direction:column;}
  .ix.center>*:first-child{margin-top:auto;}
  .ix.center>*:last-child{margin-bottom:auto;}
  .wrap{max-width:620px;width:100%;}
  .wrap.wide{max-width:760px;width:100%;}
  .browser{width:100%;}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--rasp);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12.5px;margin-bottom:10px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--rasp);}
  h1.hl{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin:0 0 8px;color:var(--green);}
  .sub{font-size:15.5px;line-height:1.5;color:#3C5A4D;margin:0 0 4px;max-width:56ch;}
  .kicker{font-size:15px;font-weight:700;color:var(--green);margin:0 0 4px;}

  /* ---------- quick check (review-screen questions) ---------- */
  .revcheck-head{font-size:13px;font-weight:800;color:var(--rasp);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 4px;}
  .revcheck-q{background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:16px 18px;margin-top:10px;}
  .revcheck-q .q{font-size:15.5px;font-weight:800;margin-bottom:12px;color:var(--green);line-height:1.35;}
  .revcheck-q .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--sand);border-radius:10px;padding:10px 13px;margin:7px 0;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit;font-weight:600;transition:.15s;}
  .revcheck-q .opt .ltr{flex:none;width:19px;height:19px;border-radius:50%;background:var(--cream-dim);color:var(--green);font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center;}
  .revcheck-q .opt:hover:not(:disabled){border-color:var(--teal);}
  .revcheck-q .opt:disabled{cursor:default;}
  .revcheck-q .opt.correct{background:#EAF6E9;border-color:#8FCB86;}
  .revcheck-q .opt.correct .ltr{background:#8FCB86;color:#fff;}
  .revcheck-q .opt.wrong{opacity:.4;}
  .revcheck-q .answer{background:var(--cream-dim);border:1.5px solid var(--sand);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:10px;line-height:1.5;color:#3C5A4D;}
  .revcheck-q .answer b{color:var(--rasp);}
  .revcheck-continue{display:block;background:var(--yellow);color:var(--green);border:none;border-radius:10px;padding:10px 20px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;margin-top:12px;}
  .revcheck-continue:hover{filter:brightness(0.96);}

  /* ---------- cover ---------- */
  .cover-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--cream);border-radius:999px;padding:8px 16px 8px 10px;font-size:13px;font-weight:800;letter-spacing:.3px;margin-bottom:22px;}
  .cover-badge svg{width:16px;height:16px;}
  .cover-meta{display:flex;gap:22px;margin-top:22px;}
  .cover-meta div{display:flex;flex-direction:column;gap:2px;}
  .cover-meta b{font-size:13px;color:var(--green);font-weight:800;}
  .cover-meta span{font-size:12.5px;color:#5c7568;}

  /* ---------- browser mock ---------- */
  .browser{border:1.5px solid var(--sand);border-radius:14px;overflow:visible;background:#fff;box-shadow:0 10px 26px -14px rgba(0,50,34,.25);max-width:520px;width:100%;}
  .browser.wide{max-width:760px;}
  .browser .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cream-dim);border-bottom:1px solid var(--sand);border-top-left-radius:12.5px;border-top-right-radius:12.5px;}
  .browser .dots{display:flex;gap:5px;flex:none;}
  .browser .dots i{width:8px;height:8px;border-radius:50%;background:#D8CDB0;display:block;}
  .browser .url{flex:1;min-width:0;background:#fff;border:1px solid var(--sand);border-radius:8px;padding:6px 12px;font-size:12.5px;color:#5c7568;font-weight:700;display:flex;align-items:center;gap:7px;overflow:hidden;}
  .browser .url span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .browser .url svg{width:11px;height:11px;flex:none;opacity:.6;}
  .browser .body{background:#F7F3EA;position:relative;border-bottom-left-radius:12.5px;border-bottom-right-radius:12.5px;}
  .capnote{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#5c7568;font-weight:700;}
  .capnote svg{width:14px;height:14px;flex:none;color:var(--rasp);}
  .infonote{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:13.5px;line-height:1.45;color:#3C5A4D;background:var(--cream-dim);border:1.5px solid var(--sand);border-radius:12px;padding:10px 14px;}
  .infonote svg{width:16px;height:16px;flex:none;color:var(--rasp);margin-top:1px;}
  .infonote b{color:var(--green);}

  /* ---------- product mock (recreated real UI, inside browser body) ---------- */
  .pm{padding:16px 20px;font-size:13.5px;color:#1a1a1a;}
  .pm-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--green);margin:-16px -20px 14px;padding:11px 20px;}
  .pm-topbar .pm-logo{display:flex;align-items:center;gap:8px;color:var(--lime);font-weight:800;font-size:14px;letter-spacing:.3px;}
  .pm-topbar .pm-logo svg{width:20px;height:20px;}
  .pm-topbar .pm-icons{display:flex;align-items:center;gap:14px;}
  .pm-cart-wrap{position:relative;}
  .pm-cart-wrap svg{width:20px;height:20px;color:var(--lime);display:block;}
  .pm-account{width:20px;height:20px;color:var(--lime);}
  .pm-h1{font-size:22px;font-weight:800;color:#1a1a1a;margin:0 0 2px;}
  .pm-sub{font-size:12.5px;color:#8a8a8a;margin:0 0 16px;}
  .pm-backrow{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .pm-back-circle{width:30px;height:30px;border-radius:50%;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex:none;}
  .pm-back-circle svg{width:14px;height:14px;color:#555;}
  .pm-cards{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:16px;}
  .pm-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .pm-card h4{font-size:13px;font-weight:800;margin:0 0 10px;color:#1a1a1a;}
  .pm-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .pm-table th{background:#F1F1F1;text-align:left;font-weight:800;padding:6px 8px;color:#333;}
  .pm-table td{padding:8px 8px;color:#333;border-top:none;}
  .pm-stats{display:flex;gap:14px;border-top:2px solid #eee;padding-top:8px;margin-top:4px;}
  .pm-stat b{display:block;font-size:16px;}
  .pm-stat.orange b{color:#D2691E;}
  .pm-stat.green b{color:#3C8B3C;}
  .pm-stat span{font-size:9px;color:#999;text-transform:uppercase;font-weight:700;}
  .pm-section-title{font-size:13px;font-weight:800;margin:10px 0 6px;color:#1a1a1a;}
  .pm-link{font-size:10.5px;color:#5c7568;text-decoration:underline;font-weight:600;}

  .pm-tilegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px;}
  .pm-tile{background:#fff;border:1.5px solid #eee;border-radius:9px;padding:12px 6px;text-align:center;font-size:9.5px;font-weight:700;color:#333;cursor:pointer;position:relative;transition:.15s;}

  /* ---------- click-here highlight (guides first-time users to the next action) ---------- */
  @keyframes hotpulse{
    0%,100%{box-shadow:0 0 0 4px rgba(204,73,131,.22);}
    50%{box-shadow:0 0 0 9px rgba(204,73,131,.06);}
  }
  .pm-hot{animation:hotpulse 1.6s ease-in-out infinite;border-color:var(--rasp) !important;}
  .pm-hot-done{border-color:var(--rasp) !important;box-shadow:0 0 0 3px rgba(204,73,131,.15);}
  span.pm-hot-done, .pm-badge-status.pm-hot-done{box-shadow:0 0 0 3px rgba(204,73,131,.18);}
  .pm-providerlink.pm-hot-done{box-shadow:none;border-bottom-color:var(--rasp) !important;}
  .pm-hot-tag{position:absolute;top:-25px;left:50%;transform:translateX(-50%);background:var(--rasp);color:#fff;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 10px -4px rgba(0,0,0,.4);pointer-events:none;z-index:6;}
  .pm-hot-tag:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--rasp);}
  .pm-focus-ring{box-shadow:0 0 0 3px rgba(204,73,131,.3);border-radius:10px;}
  .pm-tile svg{width:22px;height:22px;margin:0 auto 6px;display:block;color:#333;}
  .pm-tile.active{background:var(--lime);border-color:#1a1a1a;}
  .pm-tile:not(.active):hover{border-color:var(--rasp);}
  .pm-hint{font-size:10px;color:#999;text-align:center;margin-top:6px;}

  .pm-authblock{background:#fff;border-radius:10px;padding:14px 16px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .pm-authblock h4{font-size:13px;font-weight:800;margin:0 0 10px;line-height:1.35;}
  .pm-authrow{display:flex;gap:18px;font-size:11px;flex-wrap:wrap;align-items:flex-end;}
  .pm-authrow div{display:flex;flex-direction:column;gap:2px;}
  .pm-authrow b{font-size:12px;color:#1a1a1a;}
  .pm-authrow span{color:#999;font-size:9.5px;text-transform:uppercase;font-weight:700;}
  .pm-btn-dark{background:var(--green);color:var(--lime);border:none;border-radius:8px;padding:9px 16px;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit;margin-left:auto;}
  .pm-btn-dark:hover{background:var(--green-soft);}
  .pm-nofound{font-size:11px;color:#999;margin-top:12px;}

  .pm-fieldrow{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;position:relative;}
  .pm-field{display:flex;flex-direction:column;gap:4px;}
  .pm-field label{font-size:9.5px;color:#999;font-weight:700;text-transform:uppercase;}
  .pm-field .box{border:1.5px solid #ddd;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#333;background:#fff;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .pm-field .box.placeholder{color:#aaa;}
  .pm-field .box:hover{border-color:var(--rasp);}
  .pm-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 8px 20px -6px rgba(0,0,0,.2);z-index:5;overflow:hidden;max-height:230px;overflow-y:auto;}
  .pm-dropdown div{padding:9px 12px;font-size:11.5px;color:#333;cursor:pointer;}
  .pm-dropdown div:hover{background:#F5EEE0;}

  .pm-btn-outline{background:#fff;border:1.5px solid #ddd;border-radius:20px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}

  .pm-modal-overlay{position:fixed;inset:0;background:rgba(80,80,80,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 20px;}
  .pm-modal-overlay .pm-modal{margin:auto;}
  .pm-modal{background:#fff;border-radius:14px;padding:26px 30px;text-align:left;max-width:360px;width:100%;box-shadow:0 20px 40px -10px rgba(0,0,0,.3);}
  .pm-modal h5{font-size:15px;font-weight:800;color:#1a1a1a;margin:0 0 18px;}
  .pm-modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}

  /* ---------- bottom nav ---------- */
  .bot{display:flex;align-items:center;gap:12px;padding:14px 4px 2px;flex:none;}
  button.nav{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;letter-spacing:.2px;}
  .back{background:transparent;color:var(--cream);border:1.5px solid rgba(252,247,238,.3);}
  .back[disabled]{opacity:.25;cursor:default;}
  .next{background:var(--yellow);color:var(--green);margin-left:auto;}
  .next[disabled]{opacity:.35;cursor:default;}

  /* ---------- start overlay ---------- */
  #startOverlay{position:fixed;inset:0;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;text-align:center;padding:24px;}
  #startOverlay svg{width:40px;height:40px;}
  .so-brand{color:var(--cream);font-weight:800;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;}
  #startOverlay h1{color:var(--cream);font-size:32px;font-weight:800;margin:2px 0 0;letter-spacing:-.5px;}
  #startOverlay p{color:#B9CFC3;font-size:15.5px;margin:0 0 10px;max-width:40ch;}
  #startBtn{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--green);font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:16px 28px;cursor:pointer;letter-spacing:.2px;}
  #startBtn svg{width:18px;height:18px;}
  #startBtn:hover{filter:brightness(0.97);}
  #startOverlay.hide{display:none;}
  .audiobtn{background:transparent;border:1.5px solid rgba(252,247,238,.3);color:var(--cream);border-radius:12px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;min-width:168px;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .audiobtn svg{width:14px;height:14px;flex:none;}
  .audiobtn[hidden]{display:none;}

  /* ================= MODULE 4 SPECIFIC ================= */
  .pm-reftable{width:100%;border-collapse:collapse;font-size:10.8px;margin-top:8px;}
  .pm-reftable th{background:#F1F1F1;text-align:left;padding:8px 8px;font-weight:800;color:#333;white-space:nowrap;}
  .pm-reftable td{padding:10px 8px;color:#333;vertical-align:middle;}
  .pm-reftable tr.pm-row-hot td{background:rgba(255,214,70,.16);}

  .pm-badge-status{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:9.5px;font-weight:800;white-space:nowrap;background:#E9F3EC;color:#1E7A46;}
  .pm-badge-status i{width:6px;height:6px;border-radius:50%;background:#1E7A46;display:block;}

  .pm-expand-circle{width:30px;height:30px;border-radius:50%;border:1.5px solid #ddd;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;position:relative;transition:.15s;}
  .pm-expand-circle svg{width:14px;height:14px;color:#555;transition:transform .2s;}
  .pm-expand-circle.open svg{transform:rotate(180deg);}
  .pm-expand-circle:hover{border-color:var(--rasp);}

  .pm-refdetail{border:1.5px solid var(--sand);border-radius:12px;padding:12px 16px;margin-top:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .pm-refdetail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .pm-refdetail h5{font-size:12.5px;font-weight:800;margin:0 0 8px;}
  .pm-dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:11px;margin-bottom:8px;}
  .pm-dl div{display:flex;flex-direction:column;gap:2px;}
  .pm-dl span{color:#999;font-size:9px;text-transform:uppercase;font-weight:700;}
  .pm-dl b{color:#1a1a1a;font-size:11.5px;}
  .pm-dl a{color:var(--rasp);font-weight:700;text-decoration:none;font-size:11.5px;}

  .pm-encbox{display:flex;gap:16px;background:#F7F3EA;border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .pm-encbox div{display:flex;flex-direction:column;gap:2px;}
  .pm-encbox b{font-size:16px;}
  .pm-encbox span{font-size:9px;color:#999;text-transform:uppercase;font-weight:700;}

  .pm-notespanel{background:#F7F3EA;border-radius:10px;padding:12px 14px;font-size:11px;}
  .pm-notespanel h6{margin:0 0 8px;font-size:11px;font-weight:800;color:#1a1a1a;}
  .pm-noteitem{border-top:1px solid #E3D7BB;padding-top:8px;margin-top:8px;}
  .pm-noteitem:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .pm-noteitem b{display:block;font-size:11px;}
  .pm-noteitem span{color:#999;font-size:9.5px;}
  .pm-noteempty{color:#999;font-size:11px;}

  .pm-actionrow{display:flex;gap:10px;margin-top:14px;position:relative;}
  .pm-btn-blue{background:#1D5FBF;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit;position:relative;display:inline-flex;align-items:center;gap:10px;}
  .pm-btn-blue .pm-reveal-pill{background:#fff;color:#1D5FBF;}
  .pm-btn-blue .pm-reveal-pill.done{background:rgba(255,255,255,.4);color:#fff;}
  .pm-btn-gold{background:#B8860B;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit;}

  .pm-glossary-wrap{display:block;}
  .pm-glossary{width:100%;max-width:460px;}
  .pm-glossary table{width:100%;border-collapse:collapse;font-size:10px;}
  .pm-glossary th{text-align:left;padding:2px 6px;color:#999;font-size:9px;text-transform:uppercase;}
  .pm-glossary td{padding:3.5px 6px;border-top:1px solid #F1F1F1;color:#333;vertical-align:top;line-height:1.25;}
  .pm-glossary td:first-child{font-weight:800;white-space:nowrap;color:#1a1a1a;}

  .pm-notemodal-field{margin-bottom:14px;position:relative;}
  .pm-notemodal-field label{display:block;font-size:9.5px;color:#999;font-weight:700;text-transform:uppercase;margin-bottom:5px;}
  .pm-notemodal-field textarea{width:100%;min-height:80px;border:1.5px solid #ddd;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:12px;resize:none;color:#333;}
  .pm-notemodal-field textarea:focus{outline:none;border-color:var(--rasp);}
  .pm-modal-cancel{background:transparent;border:none;color:#5c7568;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:9px 6px;}
  .pm-modal-submit{background:var(--yellow);color:var(--green);border:none;border-radius:8px;padding:9px 18px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
  .pm-toast{display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;border-radius:9px;padding:11px 14px;margin-top:16px;font-size:12px;font-weight:700;}
  .pm-toast svg{width:16px;height:16px;color:var(--lime);flex:none;}

  .pm-providerlink{color:var(--rasp);font-weight:700;text-decoration:none;cursor:pointer;}
  .pm-providerlink:hover{text-decoration:underline;}
  .pm-providerpanel{max-width:460px;}
  .pm-providerpanel h5{font-size:13px;font-weight:800;margin:0 0 12px;}

var i=0, answered={}, lastPlayedIdx=-1;
var stage=document.getElementById('stage'), bar=document.getElementById('bar'),
    back=document.getElementById('back'), next=document.getElementById('next'),
    stepnum=document.getElementById('stepnum'), au=document.getElementById('au'),
    audioToggle=document.getElementById('audioToggle');
var AUDIO_DIR='assets/audio/';

function play(src){
  if(!src){ audioToggle.hidden=true; return; }
  au.src=AUDIO_DIR+src; audioToggle.hidden=false;
  au.play().catch(function(){ updateAudioBtn(); });
  updateAudioBtn();
}
function stopAu(){ try{au.pause();}catch(e){} au.removeAttribute('src'); audioToggle.hidden=true; }
/* plays a screen's intro narration only once per visit — re-renders of the
   same screen (e.g. answering a quiz question on Review) don't restart it */
function playOnce(src){
  if(i===lastPlayedIdx) return;
  lastPlayedIdx=i;
  play(src);
}

var ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

function updateAudioBtn(){
  audioToggle.innerHTML = au.paused
    ? ICON_PLAY+'<span>Play narration</span>'
    : ICON_PAUSE+'<span>Pause narration</span>';
}
au.addEventListener('play', updateAudioBtn);
au.addEventListener('pause', updateAudioBtn);
au.addEventListener('ended', updateAudioBtn);

audioToggle.onclick=function(){
  if(au.paused){
    if(au.ended){ au.currentTime=0; }
    au.play().catch(function(){});
  } else {
    au.pause();
  }
};

/* ---------- Explore screen: one referral, click-through hotspots ---------- */
function checklistHtml(){
  var nextKey = null;
  for(var n=0;n<CHECKLIST_ITEMS.length;n++){
    if(!answered['ex_'+CHECKLIST_ITEMS[n].key]){ nextKey = CHECKLIST_ITEMS[n].key; break; }
  }
  return '<div class="pm-checklist" id="exChecklist">'+
    CHECKLIST_ITEMS.map(function(item){
      var done = !!answered['ex_'+item.key];
      var isNext = (item.key===nextKey);
      return '<button type="button" class="pm-cl-item'+(done?' done':'')+(isNext?' next':'')+'" data-target="'+item.target+'">'+
        '<span class="pm-cl-dot">'+(done?ICON_CHECK:'')+'</span>'+item.label+
        '</button>';
    }).join('')+

function wireChecklistClicks(){
  document.querySelectorAll('.pm-cl-item').forEach(function(btn){
    btn.onclick=function(){
      var target = document.getElementById(btn.getAttribute('data-target'));
      if(!target) return;
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.remove('pm-flash'); void target.offsetWidth; target.classList.add('pm-flash');
      setTimeout(function(){ target.classList.remove('pm-flash'); }, 1600);
    };
  });
}

function shuffleArr(arr){
  var a = arr.slice();
  for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var tmp=a[k]; a[k]=a[j]; a[j]=tmp; }
  return a;
}

function renderReviewQ(qwrap, qText, opts, explain, answerKey, showContinue){
  var L=['A','B','C','D'];
  var box = el('div','revcheck-q');
  var isAnswered = answered[answerKey]!==undefined;
  var qHtml = '<div class="q">'+qText+'</div>';
  for(var o=0;o<opts.length;o++){
    var opt = opts[o];
    var cls='opt';
    if(isAnswered) cls += (opt.correct?' correct':' wrong');
    qHtml += '<button type="button" class="'+cls+'" data-oidx="'+o+'" '+(isAnswered?'disabled':'')+'><span class="ltr">'+L[o]+'</span><span>'+opt.label+'</span></button>';
  }
  if(isAnswered){
    qHtml += '<div class="answer"><b>'+(answered[answerKey]?'Correct. ':'Not quite. ')+'</b>'+explain+'</div>';
    if(showContinue) qHtml += '<button type="button" class="revcheck-continue">Continue</button>';
  }
  box.innerHTML = qHtml;
  qwrap.appendChild(box);
  if(!isAnswered){
    box.querySelectorAll('.opt').forEach(function(btn){
      btn.onclick=function(){
        if(answered[answerKey]!==undefined) return;
        var oidx = parseInt(btn.getAttribute('data-oidx'),10);
        answered[answerKey] = !!opts[oidx].correct;
        render();
      };
    });
  } else if(showContinue){
    var contBtn = box.querySelector('.revcheck-continue');
    if(contBtn) contBtn.onclick=function(){ answered['rq_current'] = (answered['rq_current']||0) + 1; render(); };
  }
}

function renderReviewCheck(qwrap){
  var cur = answered['rq_current'] || 0;
  qwrap.innerHTML = '<div class="revcheck-head">Quick check ('+(cur+1)+' of 5)</div>';

  if(cur===0){
    renderReviewQ(qwrap, REVIEW_QUESTIONS[0].q, REVIEW_QUESTIONS[0].opts, REVIEW_QUESTIONS[0].explain, 'rq_status', true);
  } else if(cur===1){
    renderReviewQ(qwrap, REVIEW_QUESTIONS[1].q, REVIEW_QUESTIONS[1].opts, REVIEW_QUESTIONS[1].explain, 'rq_provider', true);
  } else if(cur===2){
    if(!answered['rq_note_opts']){
      var actual = answered['ex_noteType'] || 'General';
      var distractors = shuffleArr(NOTE_TYPES.filter(function(t){ return t!==actual; })).slice(0,3);
      var opts = distractors.map(function(t){ return {label:t, correct:false}; });
      opts.push({label:actual, correct:true});
      answered['rq_note_opts'] = shuffleArr(opts);
    }
    var actualType = answered['ex_noteType'] || 'General';
    renderReviewQ(qwrap, "Look at the Notes panel below — what Note Type did you use when you logged your note earlier?",
      answered['rq_note_opts'],
      "You chose "+actualType+" — General is the suggested default for most day-to-day call center actions, but any type that fits the situation works.", 'rq_note', true);
  } else if(cur===3){
    renderReviewQ(qwrap, REVIEW_QUESTIONS[2].q, REVIEW_QUESTIONS[2].opts, REVIEW_QUESTIONS[2].explain, 'rq_balance', true);
  } else if(cur===4){
    renderReviewQ(qwrap, REVIEW_QUESTIONS[3].q, REVIEW_QUESTIONS[3].opts, REVIEW_QUESTIONS[3].explain, 'rq_narrative', false);
  }
}

      '<p class="sub">You\'ve learned to sign in, find your member, and create a referral. In this module, we\'ll take a quick look at a referral on their account, then go through it piece by piece — status, provider, balance, notes, and encounters — before pulling it all back together and checking what you\'ve learned.</p>'+
      '<div class="cover-meta"><div><b>~10 minutes</b><span>at your pace</span></div></div>'+
      '</div>';
    stage.appendChild(d);
    playOnce(s.au);
  }

  else if(s.t==='overview' || s.t==='review'){
    var d2=el('div','ix');
    d2.innerHTML =
      '<div class="wrap wide">'+
      '<div class="eyebrow"><span class="dot"></span>'+(s.t==='overview'?'Understanding Benefits, Balances, Referrals, and Notes':'All together now')+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>'+
      '</div>';
    var vwrap=el('div','wrap wide'); vwrap.style.marginTop='18px'; vwrap.style.marginBottom='30px';
    d2.appendChild(vwrap);
    stage.appendChild(d2);

    STEP_RENDERERS[s.render](vwrap);

    if(s.t==='review'){
      var qwrap=el('div','wrap wide');
      d2.appendChild(qwrap);
      renderReviewCheck(qwrap);
      next.disabled = !allReviewCheckAnswered();
      /* Answering a question or hitting Continue re-renders this whole
         screen, which would otherwise reset scroll to the top of the card
         every time. If the learner was already on this screen (not just
         arriving via Next/Back), keep them anchored at the bottom where
         the quiz lives instead of making them scroll down again. */
      if(isSameScreenRerender){ d2.scrollTop = d2.scrollHeight; }
    }

    playOnce(s.au);
  }

  else if(s.t==='section'){
    var d4=el('div','ix');
    d4.innerHTML =
      '<div class="wrap wide">'+
      '<div class="eyebrow"><span class="dot"></span>Section '+s.n+' of '+s.of+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>'+
      '</div>';
    var vwrap4=el('div','wrap wide'); vwrap4.style.marginTop='10px'; vwrap4.style.marginBottom='2px';
    d4.appendChild(vwrap4);
    stage.appendChild(d4);

    renderCard(vwrap4, s.mode);
    if(s.ungated){ next.disabled=false; } else { refreshSectionGate(s.key); }

    playOnce(s.au);
  }

  else if(s.t==='outro'){
    var d3=el('div','ix center');
    d3.innerHTML =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>All set</div>'+
      '<h1 class="hl">You\'re ready to manage a referral!</h1>'+
      '<p class="sub">You now know how to read a referral\'s status, find provider contact information, check the referral narrative, check its remaining balance, review encounters once a service is complete, and add a note of your own. Keep this module on hand as a reference. Continue on to the next module when you\'re ready.</p>'+
      '<a class="reslink" href="../resources/Understanding Benefits, Balances, Referrals, and Notes - Job Aid.pdf" target="_blank" rel="noopener"><svg class="reslink-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Job Aid: Understanding Benefits, Balances, Referrals, and Notes</span><svg class="reslink-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>'+
      '</div>';
    stage.appendChild(d3);
    next.disabled = false;
    playOnce(s.au);
  }
}

function finish(){ window.location.href='../../Begin-Training.html'; }

next.onclick=function(){ if(i<SCREENS.length-1){ i++; render(); } else { finish(); } };
back.onclick=function(){ if(i>0){ i--; render(); } };

document.getElementById('startBtn').onclick=function(){
  document.getElementById('startOverlay').classList.add('hide');
  render();
};
</script>
</body>
</html>
