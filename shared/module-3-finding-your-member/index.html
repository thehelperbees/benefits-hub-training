<!doctype html>
<html lang="en">
<head>
<script src="../../gate.js" data-home="../../index.html"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benefits Hub — Finding and Reviewing a Member | The Helper Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#003322; --green-soft:#0B4A36;
    --cream:#FCF7EE; --cream-dim:#F5EEE0;
    --yellow:#FFD646; --lime:#E6EC82; --teal:#82D2CA;
    --peach:#FDA761; --pink:#FEB3D3; --rasp:#CC4983;
    --sand:#E3D7BB; --ink:#0F2E23;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow-x:hidden;background:var(--green);font-family:'Manrope',system-ui,-apple-system,Arial,sans-serif;color:var(--ink);}
  #app{max-width:1080px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:22px 22px 26px;width:100%;box-sizing:border-box;}

  /* ---------- top chrome ---------- */
  .top{display:flex;align-items:center;gap:16px;padding:2px 4px 10px;flex:none;}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .brand svg{width:20px;height:20px;flex:none;}
  .brand span{color:var(--cream);font-weight:800;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;}
  .track{flex:1;display:flex;align-items:center;gap:10px;}
  .prog{flex:1;height:6px;background:rgba(252,247,238,.16);border-radius:6px;overflow:hidden;}
  .prog>i{display:block;height:100%;width:0;background:var(--yellow);border-radius:6px;transition:width .35s ease;}
  .stepnum{font-size:12px;font-weight:700;color:var(--cream);opacity:.55;white-space:nowrap;letter-spacing:.2px;}
  .home-link{display:inline-flex;align-items:center;gap:6px;color:var(--cream);opacity:.72;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px;flex:none;transition:opacity .15s ease,background .15s ease;}
  .home-link:hover{opacity:1;background:rgba(252,247,238,.08);}
  .home-link svg{width:13px;height:13px;flex:none;}

  /* ---------- stage ---------- */
  .stage{flex:1;min-height:0;background:var(--cream);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);}
  .ix{position:absolute;inset:0;overflow-y:auto;padding:26px 64px;box-sizing:border-box;}
  .center{display:flex;flex-direction:column;}
  .ix.center>*:first-child{margin-top:auto;}
  .ix.center>*:last-child{margin-bottom:auto;}
  .wrap{max-width:620px;width:100%;}
  .wrap.wide{max-width:760px;width:100%;}
  .browser{width:100%;}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--rasp);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12.5px;margin-bottom:16px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--rasp);}
  h1.hl{font-size:36px;font-weight:800;line-height:1.12;letter-spacing:-.5px;margin:0 0 8px;color:var(--green);}
  .sub{font-size:16.5px;line-height:1.42;color:#3C5A4D;margin:0 0 4px;max-width:54ch;}
  .kicker{font-size:15px;font-weight:700;color:var(--green);margin:0 0 4px;}

  /* ---------- cover ---------- */
  .cover-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--cream);border-radius:999px;padding:8px 16px 8px 10px;font-size:13px;font-weight:800;letter-spacing:.3px;margin-bottom:26px;}
  .cover-badge svg{width:16px;height:16px;}
  .cover-meta{display:flex;gap:22px;margin-top:28px;}
  .cover-meta div{display:flex;flex-direction:column;gap:2px;}
  .cover-meta b{font-size:13px;color:var(--green);font-weight:800;}
  .cover-meta span{font-size:12.5px;color:#5c7568;}

  /* ---------- browser mock ---------- */
  .browser{border:1.5px solid var(--sand);border-radius:14px;overflow:visible;background:#fff;box-shadow:0 10px 26px -14px rgba(0,50,34,.25);max-width:520px;width:100%;}
  .browser.wide{max-width:760px;}
  .browser .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cream-dim);border-bottom:1px solid var(--sand);border-radius:12.5px 12.5px 0 0;}
  .browser .dots{display:flex;gap:5px;flex:none;}
  .browser .dots i{width:8px;height:8px;border-radius:50%;background:#D8CDB0;display:block;}
  .browser .url{flex:1;min-width:0;background:#fff;border:1px solid var(--sand);border-radius:8px;padding:6px 12px;font-size:12.5px;color:#5c7568;font-weight:700;display:flex;align-items:center;gap:7px;overflow:hidden;}
  .browser .url span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .browser .url svg{width:11px;height:11px;flex:none;opacity:.6;}
  .browser .body{background:var(--cream-dim);position:relative;}
  .browser .body img{display:block;width:100%;height:auto;border-radius:0 0 12.5px 12.5px;}
  .hotspot-btn{position:absolute;border:2.5px solid var(--rasp);border-radius:9px;background:rgba(204,73,131,.07);cursor:pointer;padding:0;animation:hotpulse 1.8s ease-in-out infinite;}
  .hotspot-btn:hover{background:rgba(204,73,131,.14);}
  @keyframes hotpulse{
    0%,100%{box-shadow:0 0 0 5px rgba(204,73,131,.16);}
    50%{box-shadow:0 0 0 10px rgba(204,73,131,.05);}
  }
  .hotspot-tag{position:absolute;background:var(--rasp);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.2px;border-radius:7px;padding:5px 10px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);}
  .hotspot-tag.clickable{cursor:pointer;pointer-events:auto;}
  .shot-img{transition:opacity .18s ease;}

  .capnote{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#5c7568;font-weight:700;}
  .capnote svg{width:14px;height:14px;flex:none;color:var(--rasp);}

  /* ---------- tile switcher (Module 3 specific) ---------- */
  .tile-hit{position:absolute;border:2px dashed transparent;border-radius:12px;cursor:pointer;transition:.15s;}
  .tile-hit:hover{border-color:var(--rasp);background:rgba(204,73,131,.07);}
  .expand-btn{position:absolute;top:12px;right:12px;background:var(--green);color:var(--cream);border:none;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);z-index:5;}
  .expand-btn svg{width:16px;height:16px;}
  .expand-btn:hover{background:var(--green-soft);}

  /* ---------- zoom lightbox (Module 3 specific) ---------- */
  .zoomOverlay{position:fixed;inset:0;background:rgba(0,51,34,.75);display:none;align-items:center;justify-content:center;z-index:200;padding:24px;}
  .zoomOverlay.show{display:flex;}
  .zoomBox{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);width:min(680px,92vw);}
  .zoomBox .zbody{display:flex;align-items:center;justify-content:center;padding:22px;height:300px;max-height:60vh;box-sizing:border-box;}
  .zoomBox .zbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--cream-dim);border-bottom:1px solid var(--sand);}
  .zoomBox .zbar span{font-weight:800;color:var(--green);font-size:14px;}
  .zoomClose{background:none;border:none;cursor:pointer;color:var(--green);font-size:22px;line-height:1;padding:4px 10px;font-family:inherit;}
  .zoomBox img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;}
  .zoomBox .zbody{position:relative;}
  .zoomNav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(15,46,35,.85);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
  .zoomNav:hover{background:var(--green);}
  .zoomNav.prev{left:10px;}
  .zoomNav.next{right:10px;}
  .zoomNav svg{width:20px;height:20px;}
  .zoomDots{display:flex;gap:6px;justify-content:center;padding:10px 0 14px;background:#fff;}
  .zoomDots button{width:8px;height:8px;border-radius:50%;border:none;background:var(--sand);cursor:pointer;padding:0;}
  .zoomDots button.active{background:var(--rasp);}

  /* ---------- bottom nav ---------- */
  .bot{display:flex;align-items:center;gap:12px;padding:10px 4px 2px;flex:none;}
  button.nav{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;letter-spacing:.2px;}
  .back{background:transparent;color:var(--cream);border:1.5px solid rgba(252,247,238,.3);}
  .back[disabled]{opacity:.25;cursor:default;}
  .next{background:var(--yellow);color:var(--green);margin-left:auto;}
  .next[disabled]{opacity:.35;cursor:default;}
  .cta-btn{display:inline-flex;align-items:center;gap:9px;background:var(--yellow);color:var(--green);font-weight:800;font-size:15px;text-decoration:none;border-radius:12px;padding:14px 22px;margin-top:22px;letter-spacing:.2px;}
  .cta-btn svg{width:16px;height:16px;flex:none;}
  .cta-btn:hover{filter:brightness(0.96);}
  .cta-note{font-size:12px;color:#8a7a55;font-weight:700;margin-top:10px;font-style:italic;}

  /* ---------- confirm buttons (Yes/No) ---------- */
  .confirm-prompt{font-size:17px;font-weight:700;color:var(--green);margin:26px 0 14px;}
  .confirm-row{display:flex;gap:12px;flex-wrap:wrap;}
  .confirm-btn{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:13px 20px;font-family:inherit;font-weight:800;font-size:14.5px;color:var(--ink);cursor:pointer;transition:.15s;}
  .confirm-btn:hover{border-color:var(--teal);}
  .confirm-btn svg{width:16px;height:16px;flex:none;}
  .confirm-btn.picked-yes{border-color:#8FCB86;background:#EAF6E9;color:#256b1c;}
  .confirm-btn.picked-no{border-color:#F0B6A4;background:#FDEDEA;color:#9c3a1f;}
  .confirm-reveal{border-radius:14px;padding:18px 20px;margin-top:16px;font-size:15px;line-height:1.55;}
  .confirm-reveal.good{background:#EAF6E9;color:#256b1c;border:1.5px solid #8FCB86;}
  .confirm-reveal.warn{background:#FDEDEA;color:#9c3a1f;border:1.5px solid #F0B6A4;}
  .confirm-reveal b{display:block;margin-bottom:4px;}
  .confirm-reveal .cta-btn{margin-top:4px;}
  .confirm-reveal .cta-note{color:#9c3a1f;opacity:.75;}

  /* ---------- typed-answer check ---------- */
  .answerbox{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .answerbox input{flex:1;min-width:180px;border:1.5px solid var(--sand);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;}
  .answerbox input:focus{outline:none;border-color:var(--teal);}
  .answerbox input.right{border-color:#8FCB86;background:#EAF6E9;}
  .answerbox input.wrongans{border-color:#F0B6A4;background:#FDEDEA;}
  .checkbtn{background:var(--green);color:var(--cream);border:none;border-radius:10px;padding:12px 20px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;}
  .checkbtn:hover{background:var(--green-soft);}
  .answer-feedback{border-radius:14px;padding:16px 18px;margin-top:14px;font-size:15px;line-height:1.5;}
  .answer-feedback.right{background:#EAF6E9;color:#256b1c;border:1.5px solid #8FCB86;}

  /* ---------- mock advanced search widget ---------- */
  .mock-advsearch{margin-top:20px;background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .mock-advsearch label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#5c7568;text-transform:uppercase;letter-spacing:.4px;flex:1;min-width:150px;}
  .mock-advsearch input{border:1.5px solid var(--sand);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;font-weight:600;text-transform:none;letter-spacing:normal;}
  .mock-advsearch input:focus{outline:none;border-color:var(--teal);}
  .mock-advsearch .checkbtn{flex:none;height:44px;}
  .mock-result{margin-top:16px;background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:18px 20px;}
  .mock-result-name{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:12px;}
  .mock-result-grid{display:flex;flex-wrap:wrap;gap:22px;}
  .mock-result-grid div{display:flex;flex-direction:column;gap:3px;}
  .mock-result-grid span{font-size:11px;font-weight:800;color:#5c7568;text-transform:uppercase;letter-spacing:.4px;}
  .mock-result-grid b{font-size:15px;color:var(--ink);font-weight:700;}
  .mock-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--green);padding:12px 20px;}
  .mock-topbar .mock-logo{display:flex;align-items:center;gap:8px;color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.5px;}
  .mock-topbar .mock-logo svg{width:19px;height:19px;}
  .mock-topbar .mock-icons{display:flex;align-items:center;gap:14px;color:var(--yellow);}
  .mock-topbar .mock-icons svg{width:19px;height:19px;}
  .mock-page-body{background:var(--cream-dim);padding:20px;}
  .mock-member-header{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:2px;}
  .mock-member-sub{font-size:12.5px;color:#5c7568;margin-bottom:16px;}
  .mock-section-title{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;}
  .mock-tilegrid{display:flex;gap:10px;flex-wrap:wrap;}
  .mock-tile{flex:1;min-width:130px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:14px 10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink);}
  .mock-tile-icon{margin:0 auto 8px;width:26px;height:26px;color:#5c7568;}
  .mock-tile-icon svg{width:100%;height:100%;}
  .mock-tile.active{background:var(--lime);border-color:#1a1a1a;}
  .answer-feedback.wrongans{background:#FDEDEA;color:#9c3a1f;border:1.5px solid #F0B6A4;}
  .answer-feedback b{display:block;margin-bottom:4px;}

  /* ---------- multiple choice ---------- */
  .mcq-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:14px 18px;margin-top:10px;font-family:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s;}
  .mcq-opt:hover:not(:disabled){border-color:var(--teal);}
  .mcq-opt:disabled{cursor:default;}
  .mcq-opt.correct{border-color:#8FCB86;background:#EAF6E9;color:#256b1c;}
  .mcq-opt.wrong{border-color:#F0B6A4;background:#FDEDEA;color:#9c3a1f;}

  /* ---------- start overlay ---------- */
  #startOverlay{position:fixed;inset:0;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;text-align:center;padding:24px;}
  #startOverlay svg{width:40px;height:40px;}
  .so-brand{color:var(--cream);font-weight:800;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;}
  #startOverlay h1{color:var(--cream);font-size:32px;font-weight:800;margin:2px 0 0;letter-spacing:-.5px;}
  #startOverlay p{color:#B9CFC3;font-size:15.5px;margin:0 0 10px;max-width:40ch;}
  #startBtn{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--green);font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:16px 28px;cursor:pointer;letter-spacing:.2px;}
  #startBtn svg{width:18px;height:18px;}
  #startBtn:hover{filter:brightness(0.97);}
  #startOverlay.hide{display:none;}
  .audiobtn{background:transparent;border:1.5px solid rgba(252,247,238,.3);color:var(--cream);border-radius:12px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;min-width:168px;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .audiobtn svg{width:14px;height:14px;flex:none;}
  .audiobtn[hidden]{display:none;}

  @media(max-width:640px){
    .ix{padding:32px 22px;} h1.hl{font-size:27px;} .dm-grid{grid-template-columns:1fr;}
    .cover-meta{flex-direction:column;gap:10px;}
    .browser .body{padding:18px 16px;}
    .hotspot-tag{font-size:10px;padding:3px 7px;border-radius:5px;}
    #app{padding:16px 14px 20px;}
  }
</style>
</head>
<body>
<div id="startOverlay">
  <svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FFD646" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#FFD646"/></svg>
  <div class="so-brand">The Helper Bees</div>
  <h1>Benefits Hub: Finding and Reviewing a Member</h1>
  <p>A short, narrated walkthrough — click below to begin with sound.</p>
  <button id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start module</button>
</div>
<div id="app">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FFD646" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="#FFD646"/></svg>
      <span>The Helper Bees</span>
    </div>
    <div class="track">
      <span class="prog"><i id="bar"></i></span>
      <span class="stepnum" id="stepnum"></span>
    </div>
    <a class="home-link" href="../../Begin-Training.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>Training Home</a>
  </div>

  <div class="stage" id="stage"></div>

  <div class="bot">
    <button class="nav back" id="back">Back</button>
    <button class="audiobtn" id="audioToggle" hidden></button>
    <button class="nav next" id="next">Next</button>
  </div>
  <audio id="au"></audio>
</div>

<script>
/* ================= CONTENT ================= */

var SCREENS = [

  { t:'cover', au:'cover.mp3' },

  { t:'step', n:1, of:3,
    kicker:"Step 1",
    h:"Search for your member",
    sub:"Let's find your member. You can search by member number for the fastest results, or use Advanced Search to look someone up by first name, last name, and date of birth if you don't have their number handy.",
    visual:'shot', img:'assets/img/search.png', url:'yourcompany.benefitshub.com/search', vhCap:26, imgAspect:0.4384,
    zooms:[
      {key:'advsearch', img:'assets/img/advanced-search.png', label:'Advanced Search', left:72, top:80, width:13, height:5, tagLeft:72, tagTop:73.5, zoomAu:'screen1_advsearch.mp3'}
    ],
    caption:"Tap Advanced Search above to see the expanded form.",
    requireZoom:'advsearch',
    au:'screen1.mp3' },

  { t:'step', n:2, of:3,
    kicker:"Step 2",
    h:"The member landing page",
    sub:"Here's your member's landing page. The Overview panel holds their key details, and Recent Activity on the right keeps you posted on what's changed. Click into either one for a closer look.",
    visual:'shot', img:'assets/img/landing_top.png', url:'yourcompany.benefitshub.com/member/12345678912', wide:true, vhCap:31, imgAspect:0.4466,
    zooms:[
      {key:'overview', img:'assets/img/overview_zoom.png', label:'Overview', left:0.88, top:31.3, width:73.3, height:32.0, tagLeft:0.88, tagTop:28.0, zoomAu:'screen2_overview.mp3'},
      {key:'recent', img:'assets/img/recent_zoom.png', label:'Recent Activity', left:76.0, top:31.2, width:23.3, height:32.3, tagLeft:76.0, tagTop:28.0, zoomAu:'screen2_recent.mp3'}
    ],
    caption:"Tap Overview or Recent Activity above to see them enlarged.",
    requireZooms:['overview','recent'],
    au:'screen2.mp3' },

  { t:'step', n:3, of:3,
    kicker:"Step 3",
    h:"Benefit tiles & authorizations",
    sub:"Below Overview, you'll see the member's Benefit tiles — showing what benefits this member is eligible for. Click between tiles to compare authorization details for each one.",
    visual:'tiles',
    url:'yourcompany.benefitshub.com/member/12345678912', vhCap:31, imgAspect:0.5918,
    tiles:[
      {key:'home', img:'assets/img/benefit_home.png', label:'At Home Care', left:0.8, top:63, width:18.9, height:15},
      {key:'respite', img:'assets/img/benefit_respite.png', label:'Respite Care', left:20.6, top:63, width:18.9, height:15},
      {key:'assessments', img:'assets/img/benefit_assessments.png', label:'Assessments', left:40.3, top:63, width:18.9, height:15},
      {key:'homemod', img:'assets/img/benefit_homemod.png', label:'Home Modification, Bathroom Safety, Air Quality, Pest Control', left:60, top:63, width:18.9, height:15}
    ],
    caption:"Tap any tile above to switch, or use the enlarge button to compare them up close — you can switch tiles from there too.",
    au:'screen3.mp3' },

  { t:'findmember', au:'practice_search.mp3', auYes:'practice_search_yes.mp3', auNo:'practice_search_no.mp3' },

  { t:'verifymember', au:'practice_verify.mp3',
    opts:[
      {label:'7/13/2026', correct:false},
      {label:'12/31/2026', correct:true},
      {label:'8/7/1959', correct:false},
      {label:'12/31/2025', correct:false}
    ],
    explain:"This Home Modification benefit expires 12/31/2026 — that's the Expires field on the tile, separate from the Effective date (7/13/2026)." },

  { t:'outro', au:'outro.mp3' }
];

/* ================= ENGINE ================= */
var i=0, answered={};
var memberIdState = {typed:'', checked:false};
var stage=document.getElementById('stage'), bar=document.getElementById('bar'),
    back=document.getElementById('back'), next=document.getElementById('next'),
    stepnum=document.getElementById('stepnum'), au=document.getElementById('au'),
    audioToggle=document.getElementById('audioToggle');
var AUDIO_DIR='assets/audio/';

function play(src){
  if(!src){ audioToggle.hidden=true; return; }
  au.src=AUDIO_DIR+src; audioToggle.hidden=false;
  au.play().catch(function(){ updateAudioBtn(); });
  updateAudioBtn();
}
function stopAu(){ try{au.pause();}catch(e){} au.removeAttribute('src'); audioToggle.hidden=true; }

var ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

function updateAudioBtn(){
  audioToggle.innerHTML = au.paused
    ? ICON_PLAY+'<span>Play narration</span>'
    : ICON_PAUSE+'<span>Pause narration</span>';
}
au.addEventListener('play', updateAudioBtn);
au.addEventListener('pause', updateAudioBtn);
au.addEventListener('ended', updateAudioBtn);

audioToggle.onclick=function(){
  if(au.paused){
    if(au.ended){ au.currentTime=0; }
    au.play().catch(function(){});
  } else {
    au.pause();
  }
};

function el(tag,cls){var e=document.createElement(tag); if(cls)e.className=cls; return e;}
function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function urlBar(url){
  return '<div class="bar"><div class="dots"><i></i><i></i><i></i></div>'+
    '<div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>'+url+'</span></div></div>';
}
var LOGO_SVG='<svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="currentColor" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg>';
var ICON_CART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>';
var ICON_ACCOUNT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
function topbar(){
  return '<div class="mock-topbar"><div class="mock-logo">'+LOGO_SVG+'<span>THE HELPER BEES</span></div>'+
    '<div class="mock-icons">'+ICON_CART+ICON_ACCOUNT+'</div></div>';
}
var ICON_STORE_M3='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>';

function visual(s){
  var b=el('div', s.wide ? 'browser wide' : 'browser');
  if(s.vhCap && s.imgAspect){ b.style.maxWidth = 'min(' + (s.wide?760:520) + 'px, calc(' + s.vhCap + 'vh / ' + s.imgAspect + '))'; }
  b.innerHTML = urlBar(s.url) + '<div class="body"><img src="'+s.img+'" alt="" class="shot-img">'+
    (s.wide ? '<button type="button" class="expand-btn" aria-label="Enlarge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>' : '')+
    '</div>';
  if(s.wide){
    var expandBtn = b.querySelector('.expand-btn');
    expandBtn.onclick=function(){ openZoom(s.img, s.h||''); };
  }
  if(s.zooms){
    var body = b.querySelector('.body');
    s.zooms.forEach(function(z){
      var hbtn=el('button','hotspot-btn');
      hbtn.type='button';
      hbtn.setAttribute('aria-label', z.label);
      hbtn.style.left=z.left+'%'; hbtn.style.top=z.top+'%'; hbtn.style.width=z.width+'%'; hbtn.style.height=z.height+'%';
      var tag=el('div','hotspot-tag clickable');
      tag.textContent=z.label;
      tag.style.left=z.tagLeft+'%'; tag.style.top=z.tagTop+'%';
      var onClick=function(){
        openZoom(z.img, z.label);
        answered[z.key]=true;
        if(s.requireZoom===z.key){ next.disabled=false; }
        if(s.requireZooms){ next.disabled = !s.requireZooms.every(function(k){ return !!answered[k]; }); }
        if(z.zoomAu){ play(z.zoomAu); }
      };
      hbtn.onclick=onClick; tag.onclick=onClick;
      body.appendChild(hbtn);
      body.appendChild(tag);
    });
  }
  return b;
}

var zoomOverlayEl;
function ensureZoomOverlay(){
  if(zoomOverlayEl) return zoomOverlayEl;
  var ov=el('div','zoomOverlay'); ov.id='zoomOverlay';
  ov.innerHTML='<div class="zoomBox"><div class="zbar"><span id="zoomLabel"></span><button class="zoomClose" id="zoomClose" type="button">&times;</button></div>'+
    '<div class="zbody"><img id="zoomImg" src="" alt="">'+
    '<button type="button" class="zoomNav prev" id="zoomPrev" aria-label="Previous" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<button type="button" class="zoomNav next" id="zoomNext" aria-label="Next" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>'+
    '</div><div class="zoomDots" id="zoomDots" style="display:none;"></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target===ov) closeZoom(); });
  ov.querySelector('#zoomClose').addEventListener('click', closeZoom);
  zoomOverlayEl=ov;
  return ov;
}
function openZoom(src, label){
  var ov=ensureZoomOverlay();
  ov.querySelector('#zoomImg').src=src;
  ov.querySelector('#zoomLabel').textContent=label;
  ov.querySelector('#zoomPrev').style.display='none';
  ov.querySelector('#zoomNext').style.display='none';
  ov.querySelector('#zoomDots').style.display='none';
  ov.querySelector('#zoomDots').innerHTML='';
  ov.classList.add('show');
}
function openTileZoom(tiles, activeKey, onSwitch){
  var ov=ensureZoomOverlay();
  var idx = tiles.findIndex(function(t){ return t.key===activeKey; });
  if(idx<0) idx=0;
  function show(i2){
    idx = (i2+tiles.length)%tiles.length;
    var t = tiles[idx];
    ov.querySelector('#zoomImg').src=t.img;
    ov.querySelector('#zoomLabel').textContent=t.label||t.key;
    var dotsWrap = ov.querySelector('#zoomDots');
    dotsWrap.querySelectorAll('button').forEach(function(d,di){ d.classList.toggle('active', di===idx); });
    if(onSwitch) onSwitch(t);
  }
  ov.querySelector('#zoomPrev').style.display='flex';
  ov.querySelector('#zoomNext').style.display='flex';
  ov.querySelector('#zoomPrev').onclick=function(){ show(idx-1); };
  ov.querySelector('#zoomNext').onclick=function(){ show(idx+1); };
  var dotsWrap = ov.querySelector('#zoomDots');
  dotsWrap.style.display='flex';
  dotsWrap.innerHTML='';
  tiles.forEach(function(t,ti){
    var dot=el('button'); dot.type='button'; dot.setAttribute('aria-label', t.label||t.key);
    dot.onclick=function(){ show(ti); };
    dotsWrap.appendChild(dot);
  });
  show(idx);
  ov.classList.add('show');
}
function closeZoom(){
  var ov=document.getElementById('zoomOverlay');
  if(ov) ov.classList.remove('show');
}

function tilesVisual(s){
  var b=el('div','browser wide');
  if(s.vhCap && s.imgAspect){ b.style.maxWidth = 'min(760px, calc(' + s.vhCap + 'vh / ' + s.imgAspect + '))'; }
  var activeKey = answered['tile3'] || s.tiles[0].key;
  var activeTile = s.tiles.filter(function(t){ return t.key===activeKey; })[0] || s.tiles[0];
  b.innerHTML = urlBar(s.url) + '<div class="body"><img src="'+activeTile.img+'" alt="" class="shot-img" id="tileImg">'+
    '<button type="button" class="expand-btn" id="tileExpandBtn" aria-label="Enlarge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button></div>';
  var body = b.querySelector('.body');
  var expandBtn = b.querySelector('#tileExpandBtn');
  function switchTile(t){
    answered['tile3']=t.key;
    var img = document.getElementById('tileImg');
    if(img){ img.style.opacity='0'; setTimeout(function(){ if(img){ img.src=t.img; img.style.opacity='1'; } }, 140); }
  }
  expandBtn.onclick=function(){ openTileZoom(s.tiles, answered['tile3']||s.tiles[0].key, switchTile); };
  s.tiles.forEach(function(t){
    var hit = el('div','tile-hit');
    hit.style.left=t.left+'%'; hit.style.top=t.top+'%'; hit.style.width=t.width+'%'; hit.style.height=t.height+'%';
    hit.onclick=function(){ switchTile(t); };
    body.appendChild(hit);
  });
  return b;
}

var lastRenderedIndex = -1;
function render(){
  var s=SCREENS[i];
  var sameScreen = (i===lastRenderedIndex);
  var preservedScroll = null;
  var scrollTargetAfterAnswer = null;
  if(sameScreen){
    var oldIx = stage.querySelector('.ix');
    if(oldIx) preservedScroll = oldIx.scrollTop;
  }
  stage.innerHTML=''; stopAu(); closeZoom();
  bar.style.width = Math.round(i/(SCREENS.length-1)*100)+'%';
  stepnum.textContent = (s.t==='step') ? ('Step '+s.n+' of '+s.of) : '';
  back.disabled = (i===0);
  next.textContent = (i===SCREENS.length-1) ? 'Finish' : 'Next';
  next.disabled = false;
  lastRenderedIndex = i;

  if(s.t==='cover'){
    var d=el('div','ix center');
    d.innerHTML =
      '<div class="wrap">'+
      '<div class="cover-badge"><svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FCF7EE" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="#FCF7EE"/></svg>Benefits Hub</div>'+
      '<h1 class="hl">Finding and Reviewing a Member</h1>'+
      '<p class="sub">Now that you know how to sign in, let\'s find your way to a member\'s account. You\'ll learn how to search, read the member landing page, and view benefit details — then put it into practice with a real search of your own.</p>'+
      '<div class="cover-meta"><div><b>~12 minutes</b><span>self-paced</span></div></div>'+
      '</div>';
    stage.appendChild(d);
    play(s.au);
  }

  else if(s.t==='step'){
    if(s.requireZoom){ next.disabled = !answered[s.requireZoom]; }
    if(s.requireZooms){ next.disabled = !s.requireZooms.every(function(k){ return !!answered[k]; }); }
    var d2=el('div','ix center');
    d2.innerHTML =
      '<div class="wrap wide">'+
      '<div class="eyebrow"><span class="dot"></span>'+s.kicker+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>'+
      '</div>';
    var vwrap=el('div','wrap wide'); vwrap.style.marginTop='10px';

    if(s.visual==='tiles'){
      vwrap.appendChild(tilesVisual(s));
    } else {
      vwrap.appendChild(visual(s));
    }
    if(s.caption){
      var cap=el('div','capnote');
      cap.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>'+s.caption+'</span>';
      vwrap.appendChild(cap);
    }

    d2.appendChild(vwrap);
    stage.appendChild(d2);
    play(s.au);
  }

  else if(s.t==='findmember'){
    var dfm=el('div','ix center');
    var fm = answered['fm'] || {fn:'', ln:'', dob:'', searched:false, found:false};
    var htmlFm =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>Your turn</div>'+
      '<h1 class="hl">Find a member</h1>'+
      '<p class="sub">A member calls in, but they don\'t have their member number handy. Use the Advanced Search fields below to look them up — enter the first name, last name, and date of birth for <b>Helper Test</b>, born <b>August 7th, 1959</b>.</p>'+
      '<div class="browser wide">'+
        urlBar('yourcompany.benefitshub.com/search') +
        topbar() +
        '<div class="mock-page-body">'+
          '<div class="mock-member-header">Advanced Search</div>'+
          '<div class="mock-member-sub">Search by member details</div>'+
          '<div class="mock-advsearch">'+
            '<label>First Name<input type="text" id="fmFirst" value="'+escapeAttr(fm.fn)+'" placeholder="First Name"></label>'+
            '<label>Last Name<input type="text" id="fmLast" value="'+escapeAttr(fm.ln)+'" placeholder="Last Name"></label>'+
            '<label>Date of Birth<input type="date" id="fmDob" value="'+escapeAttr(fm.dob)+'"></label>'+
            '<button type="button" class="checkbtn" id="fmSearchBtn">Search</button>'+
          '</div>'+
          (fm.searched && !fm.found ? '<div class="confirm-reveal warn"><b>No match found.</b>Double check that all three fields are filled in exactly — first name, last name, and date of birth (08/07/1959) — then search again.</div>' : '')+
          (fm.found ? '<div class="mock-member-header" style="margin-top:16px;">Helper Test</div><div class="mock-member-sub">Member #: 12345678912</div><div class="mock-result"><div class="mock-result-name">Overview</div><div class="mock-result-grid"><div><span>Full Name</span><b>Helper Test</b></div><div><span>Date of Birth</span><b>8/7/1959</b></div></div><div class="mock-result-grid" style="margin-top:14px;"><div><span>Address</span><b>123 Bee Hive Avenue, San francisco, CA, 94102</b></div><div><span>Phone</span><b>888-888-8888</b></div></div><div class="mock-result-grid" style="margin-top:14px;"><div><span>Email</span><b>bees@gmail.com</b></div><div><span>Preferred Language</span><b>English</b></div></div></div>' : '')+
        '</div>'+
      '</div>'+
      (fm.found ? '<div class="confirm-reveal good" id="fmGoodBox"><b>Nice work — found them!</b>Now let\'s confirm you\'ve got the right member — what Member ID do you see listed at the top of their profile?</div>' : '')+
      '</div>';
    dfm.innerHTML = htmlFm;
    stage.appendChild(dfm);

    var searchBtn = document.getElementById('fmSearchBtn');
    if(searchBtn){
      searchBtn.onclick=function(){
        var fnVal = document.getElementById('fmFirst').value.trim().toLowerCase();
        var lnVal = document.getElementById('fmLast').value.trim().toLowerCase();
        var dobVal = document.getElementById('fmDob').value;
        var found = fnVal==='helper' && lnVal==='test' && dobVal==='1959-08-07';
        answered['fm'] = {
          fn:document.getElementById('fmFirst').value,
          ln:document.getElementById('fmLast').value,
          dob:dobVal, searched:true, found:found
        };
        render();
        play(found ? s.auYes : s.auNo);
      };
    }

    if(fm.found){
      var idWrap = document.getElementById('fmGoodBox');
      var abox = el('div','answerbox');
      var idInput = el('input'); idInput.type='text'; idInput.id='memberIdInput'; idInput.placeholder='Member ID';
      idInput.value = memberIdState.typed;
      abox.appendChild(idInput);
      if(!memberIdState.checked){
        var checkBtn = el('button','checkbtn'); checkBtn.type='button'; checkBtn.textContent='Check answer';
        checkBtn.onclick=function(){ memberIdState.typed=idInput.value; memberIdState.checked=true; render(); };
        abox.appendChild(checkBtn);
      } else {
        idInput.disabled = true;
      }
      idInput.oninput=function(){ memberIdState.typed=idInput.value; };
      idWrap.parentNode.insertBefore(abox, idWrap.nextSibling);

      if(memberIdState.checked){
        var normTyped = memberIdState.typed.replace(/[^0-9]/g,'');
        var isRight = (normTyped === '12345678912');
        idInput.classList.add(isRight ? 'right' : 'wrongans');
        var fb = el('div', 'answer-feedback ' + (isRight ? 'right' : 'wrongans'));
        fb.innerHTML = isRight
          ? '<b>That\'s right!</b>12345678912 is the Member ID for this test member.'
          : '<b>Not quite.</b>The Member ID is 12345678912 — you\'ll find it listed directly below the member\'s name at the top of their profile.';
        abox.parentNode.insertBefore(fb, abox.nextSibling);
        if(sameScreen) scrollTargetAfterAnswer = fb;
      }
    }

    next.disabled = !(fm.found && memberIdState.checked);
    if(!fm.searched) play(s.au);
  }

  else if(s.t==='verifymember'){
    var dvm=el('div','ix center');
    var vmPicked = answered['verifymember'];
    var htmlVm =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>One more check</div>'+
      '<h1 class="hl">Verify member benefit details</h1>'+
      '<p class="sub">Take a look at the member\'s Home Modification benefit tile.</p>'+
      '<div class="browser wide">'+
        urlBar('yourcompany.benefitshub.com/member/12345678912') +
        topbar() +
        '<div class="mock-page-body">'+
          '<div class="mock-member-header">Helper Test</div>'+
          '<div class="mock-member-sub">Member #: 12345678912</div>'+
          '<div class="mock-section-title">Benefits</div>'+
          '<div class="mock-tilegrid">'+
            '<div class="mock-tile"><div class="mock-tile-icon">'+ICON_STORE_M3+'</div><div>At Home Care</div></div>'+
            '<div class="mock-tile"><div class="mock-tile-icon">'+ICON_STORE_M3+'</div><div>Respite Care</div></div>'+
            '<div class="mock-tile"><div class="mock-tile-icon">'+ICON_STORE_M3+'</div><div>Assessments</div></div>'+
            '<div class="mock-tile active"><div class="mock-tile-icon">'+ICON_STORE_M3+'</div><div>Home Modification, Bathroom Safety, Air Quality, Pest Control</div></div>'+
          '</div>'+
          '<div class="mock-result" style="margin-top:14px;"><div class="mock-result-name">Authorizations for Home Modification, Bathroom Safety, Air Quality, Pest Control</div>'+
            '<div class="mock-result-grid" style="margin-top:10px;">'+
              '<div><span>Effective</span><b>7/13/2026</b></div>'+
              '<div><span>Expires</span><b>12/31/2026</b></div>'+
              '<div><span>Plan Code/Option</span><b>–</b></div>'+
              '<div><span>Plan Allowance</span><b>25.00</b></div>'+
              '<div><span>Used</span><b>0.00</b></div>'+
              '<div><span>Pending</span><b>0.00</b></div>'+
              '<div><span>Remaining</span><b>25.00</b></div>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="confirm-prompt">What is the correct expiration date for this benefit?</div>'+
      '</div>';
    dvm.innerHTML = htmlVm;
    var vwrap2 = dvm.querySelector('.wrap');
    s.opts.forEach(function(opt, oi){
      var obtn = el('button','mcq-opt');
      obtn.type='button';
      obtn.textContent = opt.label;
      if(vmPicked!==undefined){
        obtn.disabled = true;
        if(opt.correct) obtn.classList.add('correct');
        else if(oi===vmPicked) obtn.classList.add('wrong');
      } else {
        obtn.onclick=function(){ answered['verifymember']=oi; render(); };
      }
      vwrap2.appendChild(obtn);
    });
    if(vmPicked!==undefined){
      var vfb = el('div','answer-feedback ' + (s.opts[vmPicked].correct ? 'right':'wrongans'));
      vfb.innerHTML = '<b>'+(s.opts[vmPicked].correct?'Correct!':'Not quite.')+'</b>'+s.explain;
      vwrap2.appendChild(vfb);
      if(sameScreen) scrollTargetAfterAnswer = vfb;
    }
    stage.appendChild(dvm);
    next.disabled = (vmPicked===undefined);
    if(vmPicked===undefined) play(s.au);
  }

  else if(s.t==='outro'){
    var d3=el('div','ix center');
    d3.innerHTML =
      '<div class="wrap">'+
      '<div class="eyebrow"><span class="dot"></span>All set</div>'+
      '<h1 class="hl">You\'re ready to find your members!</h1>'+
      '<p class="sub">Keep this module on hand — you\'re welcome to come back anytime you need a refresher on searching, the landing page, or benefit details. Once you\'re ready, continue on to the next module.</p>'+
      '</div>';
    stage.appendChild(d3);
    next.disabled = false;
    play(s.au);
  }

  if(scrollTargetAfterAnswer){
    scrollTargetAfterAnswer.scrollIntoView({block:'nearest'});
  } else if(preservedScroll !== null){
    var newIx = stage.querySelector('.ix');
    if(newIx) newIx.scrollTop = preservedScroll;
  }
}

next.onclick=function(){ if(i<SCREENS.length-1){ i++; render(); } else { window.location.href='../../Begin-Training.html'; } };
back.onclick=function(){ if(i>0){ i--; render(); } };

document.getElementById('startBtn').onclick=function(){
  document.getElementById('startOverlay').classList.add('hide');
  render();
};
</script>
</body>
</html>
