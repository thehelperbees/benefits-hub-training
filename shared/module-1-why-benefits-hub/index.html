<!doctype html>
<html lang="en">
<head>
<script src="../../gate.js" data-home="../../index.html"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Melissa | Benefits Hub Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#003322; --green-soft:#0B4A36;
    --cream:#FCF7EE; --cream-dim:#F5EEE0;
    --yellow:#FFD646; --lime:#E6EC82; --teal:#82D2CA;
    --rasp:#CC4983; --sand:#E3D7BB; --ink:#0F2E23;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow-x:hidden;background:var(--green);font-family:'Manrope',system-ui,-apple-system,Arial,sans-serif;color:var(--ink);}
  #app{max-width:1080px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:16px 22px 18px;width:100%;box-sizing:border-box;}

  /* ---------- top chrome ---------- */
  .top{display:flex;align-items:center;gap:16px;padding:2px 4px 12px;flex:none;}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .brand svg{width:20px;height:20px;flex:none;}
  .brand span{color:var(--cream);font-weight:800;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;}
  .home-link{display:inline-flex;align-items:center;gap:6px;color:var(--cream);opacity:.72;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px;margin-left:auto;transition:opacity .15s ease,background .15s ease;}
  .home-link:hover{opacity:1;background:rgba(252,247,238,.08);}
  .home-link svg{width:13px;height:13px;flex:none;}
  .dots{display:flex;gap:6px;flex:none;}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(252,247,238,.25);display:block;font-style:normal;}
  .dots i.on{background:var(--yellow);}

  /* ---------- avatar badge (small fallback initials) ---------- */
  .av-badge{position:relative;border-radius:50%;overflow:hidden;flex:none;background:var(--yellow);display:inline-flex;}
  .av-badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .av-badge i{width:100%;height:100%;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:var(--green);font-size:11px;display:none;}

  /* ---------- stage: persistent avatar panel + changing content pane ---------- */
  .stage{flex:1;min-height:0;background:var(--cream);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);display:flex;}
  .stage.fullbleed{box-shadow:none;border-radius:0;}

  .stage-avatar{flex:0 0 360px;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;}
  .av-frame{position:relative;width:100%;max-width:290px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--green-soft);box-shadow:0 10px 24px -10px rgba(0,0,0,.4);}
  @keyframes avpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,214,70,.45), 0 10px 24px -10px rgba(0,0,0,.4);}
    50%{box-shadow:0 0 0 7px rgba(255,214,70,0), 0 10px 24px -10px rgba(0,0,0,.4);}
  }
  .av-frame.speaking{animation:avpulse 1.7s ease-in-out infinite;}
  .av-frame video, .av-frame .av-photo{width:100%;height:100%;object-fit:cover;object-position:50% 0%;display:block;}
  .avatar-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--green);}
  .avatar-fallback .av-badge{width:88px;height:88px;}
  .avatar-fallback .av-badge i{font-size:26px;}
  .av-audio{background:rgba(252,247,238,.1);border:1.5px solid rgba(252,247,238,.28);color:var(--cream);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;max-width:220px;}
  .av-audio svg{width:13px;height:13px;flex:none;}
  .av-audio[hidden]{display:none;}

  /* ---------- custom play prompt (shown until she starts talking) ---------- */
  .play-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,51,34,.28);cursor:pointer;border:none;padding:0;width:100%;font-family:inherit;}
  .play-overlay .circle{width:64px;height:64px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px -6px rgba(0,0,0,.55);transition:transform .15s ease;}
  .play-overlay:hover .circle{transform:scale(1.06);}
  .play-overlay svg{width:24px;height:24px;color:var(--green);margin-left:3px;}
  .play-overlay em{font-style:normal;color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.2px;background:rgba(0,51,34,.55);padding:5px 12px;border-radius:999px;}
  .play-overlay[hidden]{display:none;}

  /* ---------- fullbleed: screen 1 (Meet Melissa) fills the whole stage, no text ---------- */
  .stage.fullbleed .stage-avatar{flex:1 1 auto;padding:0;}
  .stage.fullbleed .av-frame{max-width:520px;width:auto;height:92%;aspect-ratio:832/1088;border-radius:22px;box-shadow:none;background:var(--green);}
  .stage.fullbleed .av-frame video{object-fit:cover;object-position:center;}
  .stage.fullbleed .stage-content{display:none;}

  .stage-content{flex:1;min-width:0;position:relative;border-left:1px solid var(--sand);}
  .ix{position:absolute;inset:0;overflow-y:auto;padding:28px 44px;box-sizing:border-box;display:flex;}
  .center{display:flex;flex-direction:column;}
  .ix.center>*:first-child{margin-top:auto;}
  .ix.center>*:last-child{margin-bottom:auto;}
  .wrap{max-width:560px;width:100%;}
  .wrap.wide{max-width:640px;width:100%;}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--rasp);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;margin-bottom:8px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--rasp);}
  h1.hl{font-size:27px;font-weight:800;line-height:1.14;letter-spacing:-.5px;margin:0 0 8px;color:var(--green);}
  .sub{font-size:14.5px;line-height:1.42;color:#3C5A4D;margin:0 0 4px;max-width:64ch;}

  /* ---------- how-this-works cards ---------- */
  .hiw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
  .hiw-card{background:#fff;border:1px solid var(--sand);border-radius:14px;padding:15px 16px;}
  .hiw-card .ico{width:30px;height:30px;border-radius:9px;background:var(--green);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:10px;}
  .hiw-card h3{margin:0 0 5px;font-size:13.5px;color:var(--green);font-weight:800;line-height:1.2;}
  .hiw-card p{margin:0;font-size:12px;color:#5c7568;line-height:1.42;}

  /* ---------- workflow visual (retained infographic) ---------- */
  .viz{background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:14px 16px;box-shadow:0 10px 26px -14px rgba(0,50,34,.2);margin-top:10px;}
  .viz-eyebrow{font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);margin-bottom:3px;}
  .viz h2{font-size:15px;font-weight:800;color:var(--green);margin:0 0 3px;line-height:1.15;}
  .viz .lede{color:#5c7568;font-size:11.5px;margin-bottom:10px;max-width:72ch;}
  .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;align-items:stretch;}
  .step{position:relative;background:var(--cream-dim);border:1px solid var(--sand);border-radius:12px;padding:8px 6px;text-align:center;}
  .step .n{display:inline-flex;align-items:center;justify-content:center;height:21px;width:21px;border-radius:100px;background:var(--green);color:var(--yellow);font-weight:800;font-size:11px;margin-bottom:5px;}
  .step .t{font-weight:800;font-size:10.5px;color:var(--green);letter-spacing:.01em;margin-bottom:2px;line-height:1.12;}
  .step .d{font-size:8.8px;color:#5c7568;line-height:1.28;}
  .step:not(:last-child)::after{content:"\2192";position:absolute;right:-8px;top:50%;transform:translateY(-50%);color:var(--rasp);font-size:13px;font-weight:700;z-index:2;}
  .flow-foot{display:flex;gap:8px;align-items:center;margin-top:9px;background:var(--green);color:var(--cream);border-radius:10px;padding:8px 12px;font-size:10.5px;line-height:1.35;}
  .flow-foot .dotb{height:8px;width:8px;border-radius:100px;background:var(--yellow);flex:0 0 auto;margin-top:4px;}
  .flow-foot b{color:var(--yellow);}

  /* ---------- learn list ---------- */
  .learn-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .learn-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--sand);border-radius:10px;padding:8px 14px;}
  .learn-item .bullet{flex:none;height:8px;width:8px;border-radius:100px;background:var(--rasp);}
  .learn-item .label{font-weight:700;font-size:13px;color:var(--green);}

  /* ---------- bottom nav ---------- */
  .bot{display:flex;align-items:center;gap:12px;padding:12px 4px 2px;flex:none;}
  button.nav{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;letter-spacing:.2px;}
  .back{background:transparent;color:var(--cream);border:1.5px solid rgba(252,247,238,.3);}
  .back[disabled]{opacity:.25;cursor:default;}
  .next{background:var(--yellow);color:var(--green);margin-left:auto;}
  .next[disabled]{opacity:.35;cursor:default;}

  @media(max-width:760px){
    .stage{flex-direction:column;}
    .stage-avatar{flex:none;flex-direction:row;padding:14px 16px;gap:14px;border-bottom:1px solid rgba(252,247,238,.15);}
    .av-frame{max-width:64px;aspect-ratio:1/1;border-radius:12px;}
    .av-audio{max-width:none;width:auto;}
    .stage.fullbleed .stage-avatar{flex-direction:column;padding:0;border-bottom:none;}
    .stage.fullbleed .av-frame{max-width:none;}
    .stage-content{border-left:none;}
    .ix{padding:18px 18px;}
    h1.hl{font-size:22px;}
    .flow{grid-template-columns:1fr 1fr;}
    .step:not(:last-child)::after{display:none;}
    .hiw-grid{grid-template-columns:1fr;}
    #app{padding:12px 12px 16px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none"><polygon points="20,4 34,12 34,28 20,36 6,28 6,12" stroke="#FFD646" stroke-width="3.2"/><circle cx="20" cy="20" r="3" fill="#FFD646"/></svg>
      <span>The Helper Bees</span>
    </div>
    <a class="home-link" href="../../Begin-Training.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>Training Home</a>
    <div class="dots" id="dots"></div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-avatar" id="avatarPanel"></div>
    <div class="stage-content"><div class="ix center" id="ix"></div></div>
  </div>

  <div class="bot">
    <button class="nav back" id="back">Back</button>
    <button class="nav next" id="next">Next</button>
  </div>
  <audio id="au"></audio>
</div>

<script>
/* ================================================================
   AVATAR + AUDIO SCRIPT REFERENCE (for production — not read by the page)
   All four screens use on-camera avatar clips of Melissa (same kitchen
   setting/outfit across all four, as of 2026-07-23):
     Screen 1 ("cover")      → assets/video/01_meet_melissa.mp4, fullbleed
     Screen 2 ("story")      → assets/video/02_why_benefits_hub.mp4
     Screen 3 ("howitworks") → assets/video/03_how_it_works.mp4
     Screen 4 ("closing")    → assets/video/04_whats_ahead.mp4
   Screens 2-4 play inside the persistent side panel (not fullbleed) with
   a Play/Pause button, while each screen's content pane stays as-is
   alongside her. Each video's poster frame lives alongside it in
   assets/img/ under the same basename (e.g. 02_why_benefits_hub.png) —
   see renderAvatarPanel's `s.vid` branch, which derives the poster path
   from the video filename automatically. assets/img/melissa.png is the
   generic headshot: used as screen 1's video poster and as the small
   round fallback badge (avBadge) if any video fails to load. Full
   narration text for each screen is in the `script` field and mirrors
   "Module 1 - Audio Script.md" in the project root.

   There's no separate "start" gate — the page opens directly on screen 1
   and attempts to autoplay her video. Browsers may still require one
   click on the video itself the first time (autoplay-with-sound policy),
   which is expected. Screens 2-4 audio starts automatically since it's
   triggered by the learner's own Next click.
   ================================================================ */

var SCREENS = [

  { t:'cover', vid:'01_meet_melissa.mp4',
    script:"Hi, I'm Melissa! Think of me as your guide through this training. Benefits Hub was built to make member benefit information and referral activity easier to access, manage, and understand. Before you get started, I want to show you why Benefits Hub matters, how this training works, and what's ahead — it'll only take a couple of minutes. Ready? Let's get started." },

  { t:'story',
    kicker:"Why it matters",
    h:"A more streamlined way to support members",
    sub:"Instead of juggling multiple systems or chasing down updates, everything lives in one place — so you can make faster, more confident decisions with fewer delays for members.",
    vid:'02_why_benefits_hub.mp4',
    script:"For case managers, Benefits Hub means a more streamlined way to support members — instead of juggling multiple systems or chasing down updates, everything lives in one place. That matters because timely, confident decisions make a real difference: knowing what a member's eligible for, what's already been requested, and what to do next helps you keep support moving without unnecessary delays. Here's what that looks like in practice — search, confirm, refer, track, and know your next step — all built to help you serve members with clarity and confidence." },

  { t:'howitworks',
    kicker:"Before you begin",
    h:"How this training works",
    steps:[
      {ico:"1", h:"Begin each module", d:"From your Training Home, click Begin Module to open a topic and start learning."},
      {ico:"2", h:"Finish, land back home", d:"Complete a module and you'll return to your Training Home automatically."},
      {ico:"3", h:"Go at your own pace", d:"Complete the modules in order and pickup where you left off. Revisit modules anytime as often as you'd like."}
    ],
    vid:'03_how_it_works.mp4',
    script:"Now that you know why Benefits Hub matters, here's how this training works. Your Training Home is where everything starts — you'll see a module for each topic we're covering, so just click Begin Module to open one up and dive in. Each module walks you through real Benefits Hub screens, step by step, with narration just like this one guiding you along. Once you finish a module, you'll land right back on your Training Home automatically — Go at your own pace, and pick up where you left off any time. Revisit a module as often as you'd like, until you've completed them all. And if you ever need to step away, just click Training Home at the top of any screen to jump back right away." },

  { t:'closing',
    kicker:"What's ahead",
    h:"What you'll learn in this training",
    items:[
      "Accessing Benefits Hub and signing in",
      "Finding and reviewing a member",
      "Creating and submitting a referral",
      "Understanding benefits, balances, referrals, and notes",
      "Managing common exceptions and escalations",
      "Knowledge check"
    ],
    vid:'04_whats_ahead.mp4',
    script:"As you move through this training, our goal is to help you understand both how Benefits Hub works and why each step matters — so you feel confident making workflow decisions and know when to follow up or escalate. Here's what's ahead: accessing Benefits Hub and signing in; finding and reviewing a member; creating and submitting a referral; understanding benefits, balances, referrals, and notes; managing common exceptions and escalations; and a knowledge check. Ready to get started? Go ahead and click Begin Learning. And remember, I'll be here to guide you throughout your learning journey." }
];

/* ================= ENGINE ================= */
var i=0;
var stage=document.getElementById('stage'), ix=document.getElementById('ix'), back=document.getElementById('back'), next=document.getElementById('next'),
    au=document.getElementById('au'), dotsEl=document.getElementById('dots'), avatarPanel=document.getElementById('avatarPanel');
var AUDIO_DIR='assets/audio/', VIDEO_DIR='assets/video/';
var avAudioBtn=null, avFrame=null;

var ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

function renderDots(){
  dotsEl.innerHTML = SCREENS.map(function(_,idx){ return '<i class="'+(idx<=i?'on':'')+'"></i>'; }).join('');
}

function el(tag,cls){var e=document.createElement(tag); if(cls)e.className=cls; return e;}

function avBadge(px){
  return '<span class="av-badge" style="width:'+px+'px;height:'+px+'px;">'+
    '<img src="assets/img/melissa.png" alt="Melissa" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'+
    '<i>M</i>'+
  '</span>';
}

function updateAudioBtn(){
  if(!avAudioBtn) return;
  avAudioBtn.innerHTML = au.paused ? ICON_PLAY+'<span>Play</span>' : ICON_PAUSE+'<span>Pause</span>';
  if(avFrame) avFrame.classList.toggle('speaking', !au.paused);
}
au.addEventListener('play', updateAudioBtn);
au.addEventListener('pause', updateAudioBtn);
au.addEventListener('ended', updateAudioBtn);

function play(src){
  if(!src){ au.pause(); return; }
  au.src=AUDIO_DIR+src;
  au.play().catch(function(){ updateAudioBtn(); });
  updateAudioBtn();
}
function stopAu(){ try{au.pause();}catch(e){} au.removeAttribute('src'); }

function renderAvatarPanel(s){
  avAudioBtn=null; avFrame=null;
  if(s.t==='cover'){
    avatarPanel.innerHTML =
      '<div class="av-frame" id="avFrame">'+
        '<video id="meetVid" poster="assets/img/melissa.png" playsinline controls src="'+VIDEO_DIR+s.vid+'"></video>'+
        '<div id="meetFallback" class="avatar-fallback">'+avBadge(72)+'</div>'+
        '<button class="play-overlay" id="playOverlay"><span class="circle">'+ICON_PLAY+'</span><em>Tap to begin</em></button>'+
      '</div>';
    var v=document.getElementById('meetVid');
    var playOverlay=document.getElementById('playOverlay');
    function hideOverlay(){ playOverlay.hidden=true; }
    v.addEventListener('play', hideOverlay);
    v.addEventListener('error', function(){ v.style.display='none'; document.getElementById('meetFallback').style.display='flex'; hideOverlay(); });
    playOverlay.onclick=function(){ v.play().catch(function(){}); };
    v.play().then(hideOverlay).catch(function(){ /* leave overlay visible — autoplay was blocked */ });
  } else if(s.vid){
    var panelPoster = 'assets/img/'+s.vid.replace(/\.mp4$/,'.png');
    avatarPanel.innerHTML =
      '<div class="av-frame" id="avFrame">'+
        '<video id="panelVid" playsinline poster="'+panelPoster+'" src="'+VIDEO_DIR+s.vid+'"></video>'+
        '<div class="avatar-fallback" id="panelFallback">'+avBadge(56)+'</div>'+
      '</div>'+
      '<button class="av-audio" id="avAudioBtn">'+ICON_PLAY+'<span>Play</span></button>';
    var pv=document.getElementById('panelVid');
    avAudioBtn=document.getElementById('avAudioBtn');
    avFrame=document.getElementById('avFrame');
    pv.addEventListener('error', function(){ pv.style.display='none'; document.getElementById('panelFallback').style.display='flex'; });
    function updatePanelBtn(){
      avAudioBtn.innerHTML = pv.paused ? ICON_PLAY+'<span>Play</span>' : ICON_PAUSE+'<span>Pause</span>';
      avFrame.classList.toggle('speaking', !pv.paused);
    }
    pv.addEventListener('play', updatePanelBtn);
    pv.addEventListener('pause', updatePanelBtn);
    pv.addEventListener('ended', updatePanelBtn);
    avAudioBtn.onclick=function(){
      if(pv.paused){ if(pv.ended){ pv.currentTime=0; } pv.play().catch(function(){}); }
      else { pv.pause(); }
    };
    pv.play().catch(function(){ updatePanelBtn(); });
  } else {
    avatarPanel.innerHTML =
      '<div class="av-frame" id="avFrame">'+
        '<img class="av-photo" src="assets/img/melissa.png" alt="Melissa" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'+
        '<div class="avatar-fallback">'+avBadge(56)+'</div>'+
      '</div>'+
      '<button class="av-audio" id="avAudioBtn">'+ICON_PLAY+'<span>Play</span></button>';
    avAudioBtn=document.getElementById('avAudioBtn');
    avFrame=document.getElementById('avFrame');
    avAudioBtn.onclick=function(){
      if(au.paused){ if(au.ended){ au.currentTime=0; } au.play().catch(function(){}); }
      else { au.pause(); }
    };
  }
}

function flowVisual(){
  var v=el('div','viz');
  v.innerHTML =
    '<div class="viz-eyebrow">Visual &middot; Workflow</div>'+
    '<h2>What Benefits Hub helps you do</h2>'+
    '<p class="lede"><b>See more, chase less.</b> Benefits Hub keeps referral activity and member detail in one shared view.</p>'+
    '<div class="flow">'+
      '<div class="step"><div class="n">1</div><div class="t">Find the member</div><div class="d">Search by Member ID, or name, DOB, and address.</div></div>'+
      '<div class="step"><div class="n">2</div><div class="t">Confirm the benefit</div><div class="d">Review demographics, benefits, and balances on file.</div></div>'+
      '<div class="step"><div class="n">3</div><div class="t">Create the referral</div><div class="d">Submit the right service on the member&rsquo;s behalf.</div></div>'+
      '<div class="step"><div class="n">4</div><div class="t">Track the status</div><div class="d">Follow referral progress and read notes in real time.</div></div>'+
      '<div class="step"><div class="n">5</div><div class="t">Know the next step</div><div class="d">Update, add a note, or escalate when needed.</div></div>'+
    '</div>'+
    '<div class="flow-foot"><span class="dotb"></span><div>Everyone sees the same referral updates and notes. <b>Fewer calls, faster action, clearer support for members.</b></div></div>';
  return v;
}

function render(){
  var s=SCREENS[i]; ix.innerHTML=''; stopAu();
  renderDots();
  renderAvatarPanel(s);
  stage.classList.toggle('fullbleed', s.t==='cover');
  back.disabled = (i===0);
  next.textContent = (i===SCREENS.length-1) ? 'Begin Learning' : 'Next';
  next.disabled = false;

  if(s.t==='cover'){
    /* full-bleed video, no on-screen text — she introduces herself in the clip */
  }

  else if(s.t==='story'){
    var wrap2=el('div','wrap wide');
    wrap2.innerHTML =
      '<div class="eyebrow"><span class="dot"></span>'+s.kicker+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>'+
      '<p class="sub">'+s.sub+'</p>';
    wrap2.appendChild(flowVisual());
    ix.appendChild(wrap2);
    if(s.au) play(s.au);
  }

  else if(s.t==='howitworks'){
    var wrap1=el('div','wrap wide');
    wrap1.innerHTML =
      '<div class="eyebrow"><span class="dot"></span>'+s.kicker+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>';
    var grid=el('div','hiw-grid');
    s.steps.forEach(function(step){
      var card=el('div','hiw-card');
      card.innerHTML='<div class="ico">'+step.ico+'</div><h3>'+step.h+'</h3><p>'+step.d+'</p>';
      grid.appendChild(card);
    });
    wrap1.appendChild(grid);
    ix.appendChild(wrap1);
    if(s.au) play(s.au);
  }

  else if(s.t==='closing'){
    var wrap3=el('div','wrap wide');
    wrap3.innerHTML =
      '<div class="eyebrow"><span class="dot"></span>'+s.kicker+'</div>'+
      '<h1 class="hl">'+s.h+'</h1>';
    var list=el('div','learn-list');
    s.items.forEach(function(label){
      var item=el('div','learn-item');
      item.innerHTML='<span class="bullet"></span><span class="label">'+label+'</span>';
      list.appendChild(item);
    });
    wrap3.appendChild(list);
    ix.appendChild(wrap3);
    if(s.au) play(s.au);
  }
}

function advance(){ i++; render(); }
function partnerHome(file){
  try{
    var p = new URLSearchParams(window.location.search).get('partner');
    if(p) return '../../'+p+'/'+file;
  }catch(e){}
  return '../../'+file;
}
function finish(){ window.location.href=partnerHome('Begin-Training.html'); }
(function(){ var hl=document.querySelector('.home-link'); if(hl) hl.href=partnerHome('Begin-Training.html'); })();

next.onclick=function(){ if(i<SCREENS.length-1){ advance(); } else { finish(); } };
back.onclick=function(){ if(i>0){ i--; render(); } };

render();
</script>
</body>
</html>
